// Script defines the vertical positioning of text.
enum Script {
  SCRIPT_UNSPECIFIED = 0;
  SCRIPT_BASELINE = 1;
  SCRIPT_SUB = 2;
  SCRIPT_SUPER = 3;
}

// CoordOrigin defines the coordinate system origin for bounding boxes.
enum CoordOrigin {
  COORD_ORIGIN_UNSPECIFIED = 0;
  COORD_ORIGIN_TOPLEFT = 1;
  COORD_ORIGIN_BOTTOMLEFT = 2;
}

// Orientation defines counter-clockwise rotation of a table on the page, in degrees.
enum Orientation {
  ORIENTATION_UNSPECIFIED = 0;
  ORIENTATION_ROT_0 = 1;
  ORIENTATION_ROT_90 = 2;
  ORIENTATION_ROT_180 = 3;
  ORIENTATION_ROT_270 = 4;
}

