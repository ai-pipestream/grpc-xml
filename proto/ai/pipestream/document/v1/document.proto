// Formatting contains text formatting/styling information.
message Formatting {
  bool bold = 1;
  bool italic = 2;
  bool underline = 3;
  bool strikethrough = 4;
  Script script = 5;
  // Raw script string (fallback for unknown enum values).
  optional string script_raw = 6;
  // Styles beyond the upstream dialect's set; its renderers ignore them.
  bool monospace = 7;
  bool small_caps = 8;
  bool math = 9;
  bool mark = 10;
  bool small = 11;
  bool insertion = 12;
  bool abbreviation = 13;
  bool quote = 14;
  bool overline = 15;
}

// BaseTextItem is a union type representing any text-based item in the document.
message BaseTextItem {
  oneof item {
    TitleItem title = 1;
    SectionHeaderItem section_header = 2;
    ListItem list_item = 3;
    CodeItem code = 4;
    FormulaItem formula = 5;
    TextItem text = 6;
    FieldHeadingItem field_heading = 7;
    FieldValueItem field_value = 8;
  }
}

// TextItemBase contains fields common to all text-based items.
message TextItemBase {
  string self_ref = 1;
  optional RefItem parent = 2;
  repeated RefItem children = 3;
  ContentLayer content_layer = 4;
  optional BaseMeta meta = 5;
  DocItemLabel label = 6;
  repeated ProvenanceItem prov = 7;
  string orig = 8;
  string text = 9;
  optional Formatting formatting = 10;
  optional string hyperlink = 11;
  repeated SourceType source = 12;
  repeated FineRef comments = 13;

  // Character-level formatting and link runs inside `text` (extension
  // beyond the upstream dialect, which styles whole items only).
  repeated InlineSpan spans = 14;

  // Admonition kind for callout blocks (info, warning, note, tip), when the
  // source marks one (extension beyond the upstream dialect).
  optional string admonition_kind = 15;

  // Raw label fallback for forward-compatibility with newer label vocabularies.
  optional string label_raw = 16;

  // The source's own named style for the item (a word processor's
  // paragraph style), verbatim; extension beyond the upstream dialect.
  optional string style_name = 17;

  // Comment identity when this item IS a comment (extension beyond the
  // upstream dialect).
  optional CommentMeta comment_meta = 18;

  // Identity of the drawing shape this item came from, for presentation
  // and drawing sources.
  optional ShapeMeta shape = 19;

  // Note attribution when this item is a footnote or endnote.
  optional FootnoteMeta footnote_meta = 20;

  // Index attribution when this item heads a generated index.
  optional IndexMeta index_meta = 21;

  // The item's raw source form where `text` is a projection (a passed-
  // through markup block), the block-level twin of InlineSpan.raw.
  optional string raw = 22;

  // The source element this item came from, for markup sources that keep
  // that identity.
  optional string source_element_name = 23;
  optional string source_namespace = 24;

  // Source attribution for this item's resolved fields when more than one
  // engine read them. Filled today only by the PDF consensus vote
  // (GRPARSE_PDF_BACKEND with several targets): the carried text is the
  // vote winner's reading, recorded as the field's source under the
  // "protomolt" claimant name; one further entry per losing backend whose
  // words deviated inside this item (a text deviation or an order break in
  // the page's reconciliation) names the reading that lost. The losing
  // words themselves stay on the stream's PageData.reconciliation; this
  // list only names who disagreed, on the item where they disagreed.
  // Empty for single-source items. Extension beyond the upstream dialect.
  repeated FieldSource field_sources = 25;
}

// TitleItem represents a document title or major heading.
message TitleItem {
  TextItemBase base = 1;
}

// SectionHeaderItem represents a section header with hierarchical level.
message SectionHeaderItem {
  TextItemBase base = 1;
  int32 level = 2;
}

// FieldHeadingItem represents a heading for a form field region.
message FieldHeadingItem {
  TextItemBase base = 1;
  int32 level = 2;
}

// FieldValueItem represents the value part of a form field.
message FieldValueItem {
  TextItemBase base = 1;
  string kind = 2;
}

// ListItem represents a single item in a bulleted or numbered list.
message ListItem {
  TextItemBase base = 1;
  bool enumerated = 2;
  optional string marker = 3;
}

// CodeItem represents a code block with syntax highlighting metadata.
//
// Unlike the other text variants (TitleItem, TextItem, etc.), CodeItem does
// NOT use a `TextItemBase base = 1` wrapper. Reason: in Pydantic, CodeItem
// inherits from both TextItem (whose `meta` is `Optional[BaseMeta]`) and
// FloatingItem (which overrides `meta` to `Optional[FloatingMeta]`). Wrapping
// TextItemBase here would surface two `meta` slots on the wire: `base.meta`
// (BaseMeta) and the outer override (FloatingMeta), with no schema-level
// rule for which one a producer should populate. Inlining the base fields
// keeps a single, unambiguous `meta = 5` field of type FloatingMeta.
message CodeItem {
  string self_ref = 1;
  optional RefItem parent = 2;
  repeated RefItem children = 3;
  ContentLayer content_layer = 4;
  optional FloatingMeta meta = 5;
  DocItemLabel label = 6;
  repeated ProvenanceItem prov = 7;
  string orig = 8;
  string text = 9;
  optional Formatting formatting = 10;
  optional string hyperlink = 11;
  repeated SourceType source = 12;
  repeated FineRef comments = 13;
  repeated RefItem captions = 14;
  repeated RefItem references = 15;
  repeated RefItem footnotes = 16;
  optional ImageRef image = 17;
  optional CodeLanguageLabel code_language = 18;
  // Raw language string (fallback for unknown enum values).
  optional string code_language_raw = 19;
  // Raw label fallback for forward-compatibility with newer label vocabularies.
  optional string label_raw = 20;
  // The source element this item came from, mirroring TextItemBase; this
  // item kind inlines its base fields, so the mirror is stated here.
  optional string source_element_name = 21;
  optional string source_namespace = 22;
}

// FormulaItem represents a mathematical formula or equation.
message FormulaItem {
  TextItemBase base = 1;
}

// TextItem represents generic text content (paragraphs, captions, etc.).
message TextItem {
  TextItemBase base = 1;
}

// ProvenanceItem tracks the precise location of content in the source document.
// Fields 4 and up extend the model beyond the upstream dialect: a source is
// located in whatever space it actually has - a page and box, a time range,
// a byte range, a spreadsheet cell - and an item may carry several.
message ProvenanceItem {
  int32 page_no = 1;
  BoundingBox bbox = 2;
  IntSpan charspan = 3;

  // Where the content sits in a media timeline (audio, video).
  optional TimeSpan time = 4;

  // Where the content sits in the source byte stream (fixed-length records,
  // archive members).
  optional ByteSpan byte_range = 5;

  // Where the content sits in a sheet grid.
  optional GridCell grid = 6;

  // The exact quadrilateral for rotated or skewed text; bbox stays the
  // axis-aligned hull.
  repeated Point polygon = 7;

  // Where the content sits in the source text, by line (1-based,
  // half-open), for line-addressed sources.
  optional LineSpan line_range = 8;
}

// LineSpan is a half-open 1-based source line range.
message LineSpan {
  uint32 start = 1;
  uint32 end = 2;
}

// BoundingBox defines a rectangular region in page coordinates.
message BoundingBox {
  double l = 1;
  double t = 2;
  double r = 3;
  double b = 4;
  optional CoordOrigin coord_origin = 5;
  // Raw label string (fallback for unknown enum values).
  optional string coord_origin_raw = 6;
}

// ImageRef references an embedded image with its properties.
message ImageRef {
  string mimetype = 1;
  int32 dpi = 2;
  Size size = 3;
  string uri = 4;
  // The size as the source spelled it when it is not a bare number pair
  // (20%, 5cm, 0.8 of the text width); `size` stays unset then.
  optional string size_raw = 5;
}

// Size represents 2D dimensions (width and height).
message Size {
  double width = 1;
  double height = 2;
}

// ============================================================================
// Annotation types
// ============================================================================

// DescriptionAnnotation is a text description annotation on a picture or table.
message DescriptionAnnotation {
  string kind = 1;
  string text = 2;
  string provenance = 3;
}

// MiscAnnotation holds arbitrary annotation data as a struct.
message MiscAnnotation {
  string kind = 1;
  google.protobuf.Struct content = 2;
}

// PictureClassificationClass is a single predicted class with confidence.
message PictureClassificationClass {
  string class_name = 1;
  // Presence-tracked: an engine that reports no probability leaves this
  // unset instead of claiming zero.
  optional double confidence = 2;
}

// PictureClassificationData contains classification results for a picture.
message PictureClassificationData {
  string kind = 1;
  string provenance = 2;
  repeated PictureClassificationClass predicted_classes = 3;
}

// PictureMoleculeData contains chemical structure information for a picture.
message PictureMoleculeData {
  string kind = 1;
  string smi = 2;
  double confidence = 3;
  string class_name = 4;
  repeated FloatPair segmentation = 5;
  string provenance = 6;
}

// PictureTabularChartData contains tabular chart data extracted from a picture.
message PictureTabularChartData {
  string kind = 1;
  string title = 2;
  TableData chart_data = 3;
}

// ChartLine represents a single line in a line chart.
message ChartLine {
  string label = 1;
  repeated FloatPair values = 2;
}

// PictureLineChartData contains line chart data extracted from a picture.
message PictureLineChartData {
  string kind = 1;
  string title = 2;
  string x_axis_label = 3;
  string y_axis_label = 4;
  repeated ChartLine lines = 5;
}

// ChartBar represents a single bar in a bar chart.
message ChartBar {
  string label = 1;
  double values = 2;
}

// PictureBarChartData contains bar chart data extracted from a picture.
message PictureBarChartData {
  string kind = 1;
  string title = 2;
  string x_axis_label = 3;
  string y_axis_label = 4;
  repeated ChartBar bars = 5;
}

// ChartStackedBar represents a stacked bar with multiple labeled segments.
message ChartStackedBar {
  repeated string label = 1;
  repeated StringIntPair values = 2;
}

// PictureStackedBarChartData contains stacked bar chart data.
message PictureStackedBarChartData {
  string kind = 1;
  string title = 2;
  string x_axis_label = 3;
  string y_axis_label = 4;
  repeated ChartStackedBar stacked_bars = 5;
}

// ChartSlice represents a single slice in a pie chart.
message ChartSlice {
  string label = 1;
  double value = 2;
}

// PicturePieChartData contains pie chart data extracted from a picture.
message PicturePieChartData {
  string kind = 1;
  string title = 2;
  repeated ChartSlice slices = 3;
}

// ChartPoint represents a single point in a scatter chart.
message ChartPoint {
  FloatPair value = 1;
}

// PictureScatterChartData contains scatter chart data extracted from a picture.
message PictureScatterChartData {
  string kind = 1;
  string title = 2;
  string x_axis_label = 3;
  string y_axis_label = 4;
  repeated ChartPoint points = 5;
}

// PictureAnnotation is a union of all annotation types that can appear on a picture.
//
// PLACEMENT RULE: item `meta` is the export contract; the canonical dialect
// reads meta and ignores this list entirely (upstream deprecates it in favor
// of meta). Producers that want their data visible in dialect exports MUST
// write it into meta (a first-class slot or a namespaced custom field) and
// may additionally mirror it here for wire consumers.
message PictureAnnotation {
  oneof annotation {
    DescriptionAnnotation description = 1;
    MiscAnnotation misc = 2;
    PictureClassificationData classification = 3;
    PictureMoleculeData molecule = 4;
    PictureTabularChartData tabular_chart = 5;
    PictureLineChartData line_chart = 6;
    PictureBarChartData bar_chart = 7;
    PictureStackedBarChartData stacked_bar_chart = 8;
    PicturePieChartData pie_chart = 9;
    PictureScatterChartData scatter_chart = 10;
    // Decoded machine-readable code payloads (extension beyond the upstream
    // dialect; the misc-annotation convention stays emitted alongside for
    // one release).
    BarcodeAnnotation barcode = 11;
  }
}

// TableAnnotation is a union of annotation types that can appear on a table.
message TableAnnotation {
  oneof annotation {
    DescriptionAnnotation description = 1;
    MiscAnnotation misc = 2;
  }
}

// ============================================================================
// Picture and Table items
// ============================================================================

// PictureItem represents an image or figure in the document.
message PictureItem {
  string self_ref = 1;
  optional RefItem parent = 2;
  repeated RefItem children = 3;
  ContentLayer content_layer = 4;
  optional PictureMeta meta = 5;
  DocItemLabel label = 6;
  repeated ProvenanceItem prov = 7;
  repeated RefItem captions = 8;
  repeated RefItem references = 9;
  repeated RefItem footnotes = 10;
  optional ImageRef image = 11;
  repeated SourceType source = 12;
  repeated FineRef comments = 13;
  repeated PictureAnnotation annotations = 14;
  // Raw label fallback for forward-compatibility with newer label vocabularies.
  optional string label_raw = 15;
  // Identity of the drawing shape this picture came from (extension beyond
  // the upstream dialect).
  optional ShapeMeta shape = 16;
  // A link target covering this picture's region (extension beyond the
  // upstream dialect).
  optional string hyperlink = 17;
  // An internal destination covering this picture's region: a figure that
  // jumps into the document rather than out of it.
  optional FineRef target = 18;
  // Chart provenance when this picture renders a chart (extension beyond
  // the upstream dialect).
  optional ChartMeta chart = 19;
  // The source element this picture came from, mirroring TextItemBase.
  optional string source_element_name = 20;
  optional string source_namespace = 21;
}

// ChartMeta records where a rendered chart's data came from.
message ChartMeta {
  repeated GridSpan sources = 1;
  bool has_row_headers = 2;
  bool has_column_headers = 3;
}

// PictureMeta contains rich metadata for pictures, including AI analysis.
message PictureMeta {
  optional SummaryMetaField summary = 1;
  optional DescriptionMetaField description = 2;
  optional PictureClassificationMetaField classification = 3;
  optional MoleculeMetaField molecule = 4;
  optional TabularChartMetaField tabular_chart = 5;
  optional CodeMetaField code = 6;
  optional LanguageMetaField language = 7;
  optional EntitiesMetaField entities = 8;
  optional KeywordsMetaField keywords = 9;
  optional TopicsMetaField topics = 10;
  // Alternate readings a generative engine offered; extension beyond the
  // upstream dialect.
  optional AlternativesMetaField alternatives = 11;
  // The source's accessibility title, kept beside the description so one
  // slot never has to hold two source strings.
  optional string accessibility_title = 12;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// DescriptionMetaField contains an AI-generated detailed description.
message DescriptionMetaField {
  optional double confidence = 1;
  optional string created_by = 2;
  string text = 3;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// PictureClassificationMetaField contains AI classification results.
message PictureClassificationMetaField {
  repeated PictureClassificationPrediction predictions = 1;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// PictureClassificationPrediction is a single classification result.
message PictureClassificationPrediction {
  optional double confidence = 1;
  optional string created_by = 2;
  string class_name = 3;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// MoleculeMetaField contains chemical structure information.
message MoleculeMetaField {
  optional double confidence = 1;
  optional string created_by = 2;
  string smi = 3;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// TabularChartMetaField contains chart data extracted from images.
message TabularChartMetaField {
  optional double confidence = 1;
  optional string created_by = 2;
  optional string title = 3;
  TableData chart_data = 4;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// CodeMetaField contains code OCR output extracted from a picture region.
message CodeMetaField {
  optional double confidence = 1;
  optional string created_by = 2;
  string text = 3;
  CodeLanguageLabel language = 4;
  // Raw language fallback for forward-compatibility with newer language vocabularies.
  optional string language_raw = 5;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// FloatingMeta contains metadata for floating elements (tables, code blocks, figures).
message FloatingMeta {
  optional SummaryMetaField summary = 1;
  optional DescriptionMetaField description = 2;
  optional LanguageMetaField language = 3;
  optional EntitiesMetaField entities = 4;
  optional KeywordsMetaField keywords = 5;
  optional TopicsMetaField topics = 6;
  // Alternate readings a generative engine offered; extension beyond the
  // upstream dialect.
  optional AlternativesMetaField alternatives = 7;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// TableItem represents a table in the document with full structure.
message TableItem {
  string self_ref = 1;
  optional RefItem parent = 2;
  repeated RefItem children = 3;
  ContentLayer content_layer = 4;
  optional FloatingMeta meta = 5;
  DocItemLabel label = 6;
  repeated ProvenanceItem prov = 7;
  repeated RefItem captions = 8;
  repeated RefItem references = 9;
  repeated RefItem footnotes = 10;
  optional ImageRef image = 11;
  TableData data = 12;
  repeated SourceType source = 13;
  repeated FineRef comments = 14;
  repeated TableAnnotation annotations = 15;
  // Raw label fallback for forward-compatibility with newer label vocabularies.
  optional string label_raw = 16;
}

// TableData contains the complete table structure and content.
message TableData {
  repeated TableCell table_cells = 1;
  int32 num_rows = 2;
  int32 num_cols = 3;
  repeated TableRow grid = 4;
  Orientation orientation = 5;
  // Raw orientation fallback for forward-compatibility with newer rotation values.
  optional string orientation_raw = 6;
  // Column declarations when the source has a schema (spreadsheet types,
  // fixed-record layouts); extension beyond the upstream dialect.
  repeated TableColumnSchema columns = 7;
  // Per-row provenance for record-oriented sources (byte ranges, grid
  // rows); extension beyond the upstream dialect.
  repeated ProvenanceItem row_prov = 8;
  // The fixed-record layout this table was decoded with; extension beyond
  // the upstream dialect.
  optional RecordLayoutMeta record_layout = 10;
}

// TableRow represents a single row in the table.
message TableRow {
  repeated TableCell cells = 1;
}

// TableCell represents a single cell in a table.
message TableCell {
  BoundingBox bbox = 1;
  int32 row_span = 2;
  int32 col_span = 3;
  int32 start_row_offset_idx = 4;
  int32 end_row_offset_idx = 5;
  int32 start_col_offset_idx = 6;
  int32 end_col_offset_idx = 7;
  string text = 8;
  bool column_header = 9;
  bool row_header = 10;
  bool row_section = 11;
  bool fillable = 12;
  optional RefItem ref = 13;

  // The cell's typed value when the source has one; `text` stays the
  // display string (extension beyond the upstream dialect).
  optional CellValue value = 14;

  // Character-level formatting and link runs inside `text` (extension
  // beyond the upstream dialect).
  repeated InlineSpan spans = 15;
  // Per-cell alignment when the source declares it (extension beyond the
  // upstream dialect).
  optional Alignment align = 16;
  optional VerticalAlignment valign = 17;
}

// KeyValueItem represents a key-value pair extracted from forms.
message KeyValueItem {
  string self_ref = 1;
  optional RefItem parent = 2;
  repeated RefItem children = 3;
  ContentLayer content_layer = 4;
  optional FloatingMeta meta = 5;
  DocItemLabel label = 6;
  repeated ProvenanceItem prov = 7;
  repeated RefItem captions = 8;
  repeated RefItem references = 9;
  repeated RefItem footnotes = 10;
  optional ImageRef image = 11;
  GraphData graph = 12;
  repeated SourceType source = 13;
  repeated FineRef comments = 14;
  // Raw label fallback for forward-compatibility with newer label vocabularies.
  optional string label_raw = 15;
}

// GraphData represents the structure of key-value relationships as a graph.
message GraphData {
  repeated GraphCell cells = 1;
  repeated GraphLink links = 2;
}

// GraphCellLabel defines the role of a cell in a key-value graph.
enum GraphCellLabel {
  GRAPH_CELL_LABEL_UNSPECIFIED = 0;
  GRAPH_CELL_LABEL_KEY = 1;
  GRAPH_CELL_LABEL_VALUE = 2;
  GRAPH_CELL_LABEL_CHECKBOX = 3;
}

// GraphCell is a node in the key-value graph.
message GraphCell {
  GraphCellLabel label = 1;
  int32 cell_id = 2;
  string text = 3;
  string orig = 4;
  optional ProvenanceItem prov = 5;
  optional RefItem item_ref = 6;
}

// GraphLinkLabel defines the type of relationship between cells.
enum GraphLinkLabel {
  GRAPH_LINK_LABEL_UNSPECIFIED = 0;
  GRAPH_LINK_LABEL_TO_VALUE = 1;
  GRAPH_LINK_LABEL_TO_KEY = 2;
  GRAPH_LINK_LABEL_TO_PARENT = 3;
  GRAPH_LINK_LABEL_TO_CHILD = 4;
}

// GraphLink is an edge in the key-value graph.
message GraphLink {
  GraphLinkLabel label = 1;
  int32 source_cell_id = 2;
  int32 target_cell_id = 3;
}

// FormItem represents a form element in the document.
message FormItem {
  string self_ref = 1;
  optional RefItem parent = 2;
  repeated RefItem children = 3;
  ContentLayer content_layer = 4;
  optional FloatingMeta meta = 5;
  DocItemLabel label = 6;
  repeated ProvenanceItem prov = 7;
  repeated RefItem captions = 8;
  repeated RefItem references = 9;
  repeated RefItem footnotes = 10;
  optional ImageRef image = 11;
  GraphData graph = 12;
  repeated SourceType source = 13;
  repeated FineRef comments = 14;
  // Raw label fallback for forward-compatibility with newer label vocabularies.
  optional string label_raw = 15;
}

// FieldRegionItem represents a region containing form fields.
message FieldRegionItem {
  string self_ref = 1;
  optional RefItem parent = 2;
  repeated RefItem children = 3;
  ContentLayer content_layer = 4;
  optional BaseMeta meta = 5;
  DocItemLabel label = 6;
  repeated ProvenanceItem prov = 7;
  repeated SourceType source = 8;
  repeated FineRef comments = 9;
}

// FieldItem represents an individual form field item.
message FieldItem {
  string self_ref = 1;
  optional RefItem parent = 2;
  repeated RefItem children = 3;
  ContentLayer content_layer = 4;
  optional BaseMeta meta = 5;
  DocItemLabel label = 6;
  repeated ProvenanceItem prov = 7;
  repeated SourceType source = 8;
  repeated FineRef comments = 9;

  // The field's programmatic name in the source form (extension beyond the
  // upstream dialect).
  optional string field_name = 10;
  // A choice field's entries and which one is selected; selected_index is
  // presence-tracked because zero is a real selection.
  repeated string options = 11;
  optional int32 selected_index = 12;
  // The field's span in the document's annotation space.
  optional FineRef span = 13;
  // Fieldmark parameters, a genuinely open per-field vocabulary.
  map<string, string> parameters = 14;
}

// PageItem represents metadata about a single page in the document.
message PageItem {
  Size size = 1;
  optional ImageRef image = 2;
  int32 page_no = 3;
  // The coordinate unit this page's size and its items' boxes are measured
  // in (px, pt, twip); unset keeps the producer's historical space.
  // Extension beyond the upstream dialect.
  optional string unit = 4;
  // Extraction diagnostics for the page, when the producer measures them.
  optional PageQuality quality = 5;
  // The named page style this page uses, resolving into
  // Document.page_styles.
  optional string style_name = 6;
  // The page's own label when the source numbers pages in its own scheme
  // (iv, A-1) rather than by ordinal.
  optional string page_label = 7;
  // The full media box when it differs from the cropped `size`.
  optional Size media_size = 8;
  // The source's unit multiplier over its default unit (a PDF /UserUnit).
  optional double user_unit = 9;
}

// PageQuality carries a page's extraction diagnostics as the measurements
// they are, not booleans.
message PageQuality {
  // Letter-frequency garble score for the page's text layer, 0.0 clean.
  optional double garble_score = 1;
  // Count of replacement-character runs in the text layer.
  optional int32 replacement_runs = 2;
  // The producer's verdict that raster OCR would beat this text layer.
  optional bool ocr_recommended = 3;
  // Rotation the producer detected and applied, degrees clockwise.
  optional double rotation_degrees = 4;
}

// ============================================================================
// Model extensions
//
// Everything below extends the model beyond the upstream dialect. The
// renderers that produce that dialect ignore these shapes; every other
// consumer may rely on them. All extensions are additive: removing them
// yields a document the upstream dialect can express.
// ============================================================================

// TimeSpan locates content in a media timeline.
message TimeSpan {
  double start_ms = 1;
  double end_ms = 2;
  // Which stream the span belongs to, for multi-track sources.
  optional int32 track = 3;
  // Speaker or voice attribution for the span.
  optional string speaker = 4;
}

// ByteSpan locates content in the source byte stream.
message ByteSpan {
  uint64 start = 1;
  uint64 end = 2;
}

// GridCell locates content in a sheet grid (zero-based).
message GridCell {
  int32 row = 1;
  int32 col = 2;
  optional string sheet = 3;
}

// Point is one vertex of a provenance polygon, in the same coordinate space
// as the owning bounding box.
message Point {
  double x = 1;
  double y = 2;
}

// InlineSpan is one formatting or link run inside an item's text. Ranges are
// code points into `text`, half-open, and may overlap (bold and linked at
// once arrives as two spans or one span carrying both).
message InlineSpan {
  IntSpan range = 1;
  optional Formatting formatting = 2;
  optional string hyperlink = 3;
  // Internal cross-reference target (footnote, citation, section).
  optional FineRef target = 4;
  // Character-run attributes beyond the boolean set: the source's font
  // family and size (points), text color as #rrggbb, and the run's own
  // language tag when it differs from the item's.
  optional string font_family = 5;
  optional double font_size_pt = 6;
  optional string color = 7;
  optional string language = 8;
  // The source field code a generated run came from (a page number, a
  // date, a cross-reference), so resolved field text stays distinguishable
  // from authored text.
  optional string field_code = 9;
  // What the span's target is, when the source distinguishes.
  optional ReferenceKind reference_kind = 10;
  // The reference key exactly as the source wrote it, kept even when no
  // declared anchor resolves it.
  optional string reference = 11;
  // The link's title attribute, when the source states one.
  optional string link_title = 12;
  // The span's raw payload where the rendered text is a projection (an
  // abbreviation's expansion, inline math in its source syntax).
  optional string raw = 13;
  // The source's named character style for the run.
  optional string style_name = 14;
  // Highlight color as #rrggbb, when the source states one.
  optional string highlight_color = 15;
  // Interlinear annotation over the run (ruby text).
  optional string annotation = 16;
}

// ReferenceKind names what an inline reference points at.
enum ReferenceKind {
  REFERENCE_KIND_UNSPECIFIED = 0;
  REFERENCE_KIND_CITATION = 1;
  REFERENCE_KIND_FOOTNOTE = 2;
  REFERENCE_KIND_CLAIM = 3;
  REFERENCE_KIND_SECTION = 4;
  REFERENCE_KIND_CROSS_REF = 5;
  REFERENCE_KIND_FIGURE = 6;
  REFERENCE_KIND_TABLE = 7;
  REFERENCE_KIND_EQUATION = 8;
}

// DocumentMeta carries the metadata the source declares about itself.
message DocumentMeta {
  optional string title = 1;
  repeated string authors = 2;
  // Creation and modification instants. The typed field carries the parsed
  // instant; the _raw twin keeps the source's own spelling and is the only
  // field set when the source's value does not parse.
  optional google.protobuf.Timestamp created = 3;
  optional google.protobuf.Timestamp modified = 4;
  // BCP 47 language tag.
  optional string language = 5;
  // The software that produced the source file.
  optional string generator = 6;
  repeated string keywords = 7;
  // The schema the source declares for itself (an XML xsi:schemaLocation).
  optional string schema_location = 8;
  optional string created_raw = 9;
  optional string modified_raw = 10;
  // Source-scoped identifiers (a DOI, a PMID, an ISSN), each typed.
  repeated Identifier identifiers = 11;
  // Classification codes the source carries (CPC, IPC, subject schemes).
  repeated Classification classifications = 12;
  optional LicenseMeta license = 13;
  repeated FundingAward funding = 14;
  // Namespace bindings and schema locations an XML source declares.
  repeated NamespaceBinding namespaces = 15;
  repeated SchemaLocation schema_locations = 16;
  // Civil twins for sources that state a date without an instant (a
  // publication year and month); the Timestamp fields stay unset then.
  optional CivilDateTime created_civil = 17;
  optional CivilDateTime modified_civil = 18;
  optional string subject = 19;
  // Who last modified the document, as the source records it.
  optional string modified_by = 20;
  // The last print, when the source tracks it.
  optional google.protobuf.Timestamp printed = 21;
  optional string printed_raw = 22;
  optional string printer = 23;
  // The template the document was created from.
  optional string template = 24;
  optional int32 editing_cycles = 25;
  optional int64 editing_duration_seconds = 26;
  optional DocumentStatistics statistics = 27;
  // Typed user-defined properties, each in the shape the source stored.
  repeated UserProperty user_properties = 28;
  // The source format's own version (a PDF version, an office format
  // generation).
  optional string format_version = 29;
  // Whether the source declares authored structure (a tagged PDF).
  optional bool structured = 30;
  // The authoring application, when the source distinguishes it from the
  // producing one in `generator`.
  optional string authoring_tool = 31;
  optional Protection protection = 32;
  // The source's raw embedded metadata packet (XMP), verbatim bytes.
  optional bytes raw_metadata = 33;
  // The source's trapping declaration, three-valued as the format defines
  // it.
  optional Trapped trapped = 34;
  // Source metadata that is genuinely open vocabulary. Data whose shape the
  // fleet knows gets a typed field, never an entry here.
  // Which collector's answer each resolved singular field carries.
  // Extension beyond the upstream dialect.
  repeated FieldSource field_sources = 35;
  map<string, string> extra = 100;
}

// Identifier is one source-scoped identifier.
message Identifier {
  // The identifier scheme (doi, pmid, issn, publisher-id).
  string kind = 1;
  string value = 2;
  // The scope the source attaches (electronic vs print ISSN).
  optional string scope = 3;
}

// Classification is one classification code the source declares.
message Classification {
  string scheme = 1;
  string code = 2;
  optional string edition = 3;
  optional string office = 4;
}

// LicenseMeta carries the source's own license and copyright statement.
message LicenseMeta {
  optional string type_uri = 1;
  optional string statement = 2;
  optional string copyright_statement = 3;
  optional int32 copyright_year = 4;
  optional string copyright_holder = 5;
}

// FundingAward is one funding statement the source records.
message FundingAward {
  optional string funder = 1;
  optional string award_id = 2;
  optional string statement = 3;
}

// NamespaceBinding is one prefix-to-URI binding an XML source declares.
message NamespaceBinding {
  string prefix = 1;
  string uri = 2;
}

// SchemaLocation is one namespace-to-location pair from a schema
// declaration.
message SchemaLocation {
  string namespace = 1;
  string location = 2;
}

// Alignment is a horizontal alignment a source declares.
enum Alignment {
  ALIGNMENT_UNSPECIFIED = 0;
  ALIGNMENT_LEFT = 1;
  ALIGNMENT_CENTER = 2;
  ALIGNMENT_RIGHT = 3;
  ALIGNMENT_JUSTIFY = 4;
}

// VerticalAlignment is a vertical alignment a source declares.
enum VerticalAlignment {
  VERTICAL_ALIGNMENT_UNSPECIFIED = 0;
  VERTICAL_ALIGNMENT_TOP = 1;
  VERTICAL_ALIGNMENT_MIDDLE = 2;
  VERTICAL_ALIGNMENT_BOTTOM = 3;
}

// CellValue is a table cell's typed value; the cell's `text` stays the
// display string.
message CellValue {
  oneof kind {
    double number = 1;
    bool boolean = 2;
    // The parsed date or datetime, timezone-honest: spreadsheet dates are
    // civil values, not instants.
    CivilDateTime datetime = 3;
    // The source formula, in the source's own syntax.
    string formula = 4;
    // The source's error literal (a spreadsheet #DIV/0!, a conversion
    // failure marker).
    string error = 5;
  }
  // The source's display format string for the value.
  optional string number_format = 10;
}

// CivilDateTime is a wall-clock date or datetime as the source wrote it,
// without inventing a timezone the source never stated.
message CivilDateTime {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
  optional int32 hour = 4;
  optional int32 minute = 5;
  optional int32 second = 6;
  optional int32 nanos = 7;
  // Only when the source itself states an offset.
  optional int32 utc_offset_minutes = 8;
}

// TableColumnSchema declares one column of a schema-carrying table
// (spreadsheet types, fixed-record layouts).
message TableColumnSchema {
  // Presence-tracked: a column that carries only geometry declares no name
  // rather than a blank one.
  optional string name = 1;
  // The source's own type name (copybook usage, cell type, SQL type).
  optional string declared_type = 2;
  // Copybook picture clause, when the source is a fixed-record layout.
  optional string picture = 3;
  optional uint64 byte_offset = 4;
  optional uint64 byte_size = 5;
  // Copybook level number.
  optional int32 level = 6;
  // One-based occurrence for a column inside an OCCURS group; unset for
  // columns that occur once.
  optional int32 occurs_index = 7;
  // The column's display width in the page unit, when the source declares
  // one; width_raw keeps spellings that are not page units (20%, 5cm).
  optional double width = 9;
  optional string width_raw = 10;
  optional Alignment align = 11;
  optional VerticalAlignment valign = 12;
  // Named value conditions declared on the column (copybook level-88).
  repeated ValueCondition conditions = 8;
}

// SubDocumentRef registers one nested payload the source carries (a mail
// part, an embedded file, a page attachment) so a downstream parser can fan
// out on it. The id is the stable pointer other conventions in the fleet
// already embed in item text (for example part:<part_id>).
message SubDocumentRef {
  string id = 1;
  string name = 2;
  string media_type = 3;
  uint64 size_bytes = 4;
  // The item that mentions or anchors the payload, when one does.
  optional string item_ref = 5;
  // Embedded-object identity: the container's class id and its own word
  // for what the object is.
  optional string class_id = 6;
  optional string kind = 7;
}

// WebMeta carries retrieval provenance for crawled sources.
message WebMeta {
  // The URI the content was actually fetched from.
  optional string target_uri = 1;
  // The page's self-declared canonical URI.
  optional string canonical_uri = 2;
  // Capture instant; the _raw twin keeps the source's spelling and is the
  // only field set when it does not parse.
  optional google.protobuf.Timestamp crawl_time = 3;
  optional int32 http_status = 4;
  optional string content_language = 5;
  // Response headers, lower-cased names. Header names are an open
  // vocabulary; the map is the honest type here.
  map<string, string> headers = 6;
  optional string crawl_time_raw = 7;
}

// MetaTag is one page-level name/content meta pair.
message MetaTag {
  string name = 1;
  string content = 2;
}

// StructuredData is one machine-readable data block embedded in the source,
// verbatim.
message StructuredData {
  // The block's dialect: json-ld, microdata, opengraph, rdfa.
  string kind = 1;
  string json = 2;
}

// MediaMeta describes the media stream a transcript came from.
message MediaMeta {
  optional double duration_ms = 1;
  // Distinct speaker labels, in first-appearance order.
  repeated string speakers = 2;
  optional string codec = 3;
}

// GenerationSource attributes model-generated content to its generation.
message GenerationSource {
  string model = 1;
  optional string endpoint = 2;
  // The provider's stop reason, verbatim; a length stop means the content
  // is truncated.
  optional string finish_reason = 3;
  optional uint64 prompt_tokens = 4;
  optional uint64 completion_tokens = 5;
  optional double temperature = 6;
}

// OutlineEntry is one row of the source's own table of contents.
message OutlineEntry {
  string title = 1;
  int32 level = 2;
  optional int32 page_no = 3;
  // The item or destination the entry points at, when resolvable.
  optional FineRef target = 4;
}

// ChangeRecord is one tracked change the source records.
message ChangeRecord {
  // Stable id within the document, as the source names it.
  string id = 1;
  // The change kind in the source's own vocabulary (insert, delete,
  // format), lower-cased.
  string kind = 2;
  string author = 3;
  // The change instant; the _raw twin keeps the source's spelling and is
  // the only field set when it does not parse.
  optional google.protobuf.Timestamp timestamp = 4;
  // The item and span the change touches.
  optional FineRef target = 5;
  // The text the change removed or replaced, when the source keeps it.
  optional string content = 6;
  optional string timestamp_raw = 7;
}

// NamedAnchor is one named position the source declares.
message NamedAnchor {
  string name = 1;
  FineRef target = 2;
}

// ValueRange is one literal or literal range in a value condition; the
// bounds are the source's own literals.
message ValueRange {
  string low = 1;
  optional string high = 2;
}

// ValueCondition is one named value condition a column declares.
message ValueCondition {
  string name = 1;
  repeated ValueRange values = 2;
}

// EmailParty is one addressee, split as the source states it.
message EmailParty {
  optional string name = 1;
  string address = 2;
}

// EmailMeta is the typed message envelope of a mail source.
message EmailMeta {
  repeated EmailParty from = 1;
  repeated EmailParty to = 2;
  repeated EmailParty cc = 3;
  repeated EmailParty bcc = 4;
  optional string message_id = 5;
  // Every id the reply header names, individually.
  repeated string in_reply_to = 6;
  // Every id from every References header instance, in order.
  repeated string references = 7;
  optional string conversation_topic = 8;
  // The source's conversation index, verbatim bytes.
  optional bytes conversation_index = 9;
  // The sent instant; the _raw twin keeps the source's spelling and is the
  // only field set when it does not parse.
  optional google.protobuf.Timestamp sent = 10;
  optional string sent_raw = 11;
}

// Hypothesis is one alternate reading a generative engine offered.
message Hypothesis {
  string text = 1;
  // The engine's unrescaled score for this reading, with its kind named.
  optional double raw_score = 2;
  optional string raw_score_kind = 3;
  // Code points into the owning item's text, when the alternative applies
  // to a span rather than the whole item.
  optional IntSpan range = 4;
}

// AlternativesMetaField carries the alternate readings an engine offered.
message AlternativesMetaField {
  repeated Hypothesis hypotheses = 1;
  optional string created_by = 2;
}

// CommentMeta is the identity and thread position of a comment item.
message CommentMeta {
  optional string author = 1;
  optional string initials = 2;
  optional google.protobuf.Timestamp timestamp = 3;
  optional string timestamp_raw = 4;
  bool resolved = 5;
  // The comment this one replies to.
  optional FineRef parent = 6;
  // The text the comment anchors to, verbatim.
  optional string anchored_text = 7;
  // A note the source displays permanently rather than on hover.
  bool shown = 8;
}

// ShapeMeta is the identity of the drawing shape an item came from.
message ShapeMeta {
  // The source's shape service or type name.
  optional string shape_type = 1;
  optional string name = 2;
  // Text-frame chaining, by frame name.
  optional string chain_next = 3;
  optional string chain_prev = 4;
  optional int32 z_order = 5;
  optional double rotation_degrees = 6;
}

// FootnoteMeta attributes a footnote or endnote item.
message FootnoteMeta {
  // The note's label as rendered (a number, a symbol).
  optional string label = 1;
  bool endnote = 2;
  // The span in the body where the note's mark sits.
  optional FineRef mark = 3;
}

// IndexMeta attributes a generated index item.
message IndexMeta {
  // The source's index service or kind name.
  optional string service = 1;
  optional string title = 2;
}

// Trapped is a source's own three-valued trapping declaration.
enum Trapped {
  TRAPPED_UNSPECIFIED = 0;
  TRAPPED_TRUE = 1;
  TRAPPED_FALSE = 2;
  TRAPPED_UNKNOWN = 3;
}

// Protection is the source's own protection posture, as facts rather than
// a boolean.
message Protection {
  bool encrypted = 1;
  optional string handler = 2;
  optional int32 key_bits = 3;
  // The parse opened it without a password (an empty owner password).
  bool opened_without_password = 4;
  bool allows_extraction = 5;
  bool allows_printing = 6;
}

// DocumentStatistics carries the source's own document statistics.
message DocumentStatistics {
  optional int64 pages = 1;
  optional int64 words = 2;
  optional int64 characters = 3;
  optional int64 paragraphs = 4;
  optional int64 tables = 5;
  optional int64 images = 6;
  optional int64 objects = 7;
  optional int64 cells = 8;
  optional int64 sheets = 9;
}

// UserProperty is one user-defined document property in the shape the
// source stored it.
message UserProperty {
  string name = 1;
  oneof value {
    string text = 2;
    double number = 3;
    bool boolean = 4;
    google.protobuf.Timestamp instant = 5;
    CivilDateTime date = 6;
  }
}

// Margins are the four page margins in the page unit.
message Margins {
  double left = 1;
  double top = 2;
  double right = 3;
  double bottom = 4;
}

// PageStyle is one named page style the source declares.
message PageStyle {
  string name = 1;
  Size size = 2;
  optional Margins margins = 3;
  optional int32 columns = 4;
  // The style's variant: shared, first, left, right.
  optional string variant = 5;
}

// GridSpan is a rectangular sheet range.
message GridSpan {
  GridCell start = 1;
  GridCell end = 2;
}

// NamedRange is one named or database range a spreadsheet declares.
message NamedRange {
  string name = 1;
  GridSpan range = 2;
  bool has_headers = 3;
  bool has_totals = 4;
  // named or database.
  optional string kind = 5;
  // The defining expression when the range is a formula rather than a
  // rectangle; `range` stays unset then.
  optional string expression = 6;
}

// PivotSpec is one pivot table definition.
message PivotSpec {
  string name = 1;
  optional GridSpan source = 2;
  optional GridSpan output = 3;
  repeated string row_fields = 4;
  repeated string column_fields = 5;
  repeated string data_fields = 6;
  repeated string page_fields = 7;
}

// SheetMeta carries a spreadsheet sheet's own attributes.
message SheetMeta {
  optional int32 index = 1;
  bool visible = 2;
  // Tab color as #rrggbb.
  optional string tab_color = 3;
  repeated GridSpan print_areas = 4;
}

// RecordLayoutMeta describes the fixed-record layout a table was decoded
// with.
message RecordLayoutMeta {
  // The source byte encoding (an EBCDIC code page name).
  optional string encoding = 1;
  optional uint64 record_length = 2;
  optional uint64 header_bytes = 3;
  optional uint64 footer_bytes = 4;
  optional uint64 prefix_bytes = 5;
  // Rows the producer's row cap dropped; zero means the table is complete.
  optional uint64 rows_truncated = 6;
}

// BarcodeAnnotation is one decoded machine-readable code payload.
message BarcodeAnnotation {
  // The symbology name as the decoder reports it (QRCode, Code128).
  string format = 1;
  // The decoded content.
  string value = 2;
  // The decoding engine.
  string provenance = 3;
}
