syntax = "proto3";

package ai.pipestream.document.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "DocumentProto";
option java_package = "ai.pipestream.document.v1";

// Pipestream document structure.
//
// This proto defines the complete structure of a parsed document. The schema
// is the upstream document v2 JSON schema mirrored field for field, plus the
// documented extensions this repo adds on top of it; every extension is
// called out at its own field and is additive, so removing them all yields a
// document the upstream dialect can express. The mirror is maintained by
// review, and "upstream" in comments below refers to that schema.
//
// Field-number policy:
// - `custom_fields` is pinned at 100 in every message that carries one, so
//   the escape hatch sits at the same number wherever a reader looks for it.
// - Extension fields are appended after the numbers the upstream mirror
//   occupies, never interleaved with them, so an upstream addition lands on
//   the number upstream chose.
// - Numbers are never reused. No field in this file has ever been removed,
//   which is why there are no `reserved` ranges to guard; the day one is,
//   its number and name go into a `reserved` statement in the same change.
//
// Document Structure Overview:
// ===========================
//
// A Document contains:
// - Hierarchical structure (body, furniture, groups)
// - Text content (titles, headers, paragraphs, lists, code, formulas)
// - Visual elements (pictures with AI-generated descriptions and annotations)
// - Tabular data (tables with cell-level structure and annotations)
// - Form data (key-value pairs, form fields)
// - Page metadata (size, images)
// - Provenance tracking (bounding boxes, page numbers)

// Document is the root message representing a complete parsed document.
message Document {
  // Schema identifier for versioning (e.g., "docling_document_v2"). Producers
  // stamp it, but upstream interop does not run through this field: the
  // canonical renderer emits the upstream identity from its own constant and
  // ignores whatever a producer put here.
  optional string schema_name = 1;

  // Version number of the upstream schema used
  optional string version = 2;

  // Human-readable name or title of the document
  string name = 3;

  // Metadata about the source document (file info, hash, etc.)
  optional DocumentOrigin origin = 4;

  // Document furniture: headers, footers, page numbers, watermarks, and other
  // non-content elements that appear on the page but are not part of the
  // document's semantic body.
  GroupItem furniture = 13;

  // The root body group containing the main document structure.
  GroupItem body = 5;

  // Additional groups representing logical sections (chapters, sections, etc.).
  repeated GroupItem groups = 6;

  // All text items in the document (titles, paragraphs, lists, etc.).
  repeated BaseTextItem texts = 7;

  // All picture/image items in the document.
  repeated PictureItem pictures = 8;

  // All table items in the document.
  repeated TableItem tables = 9;

  // Key-value pairs extracted from forms or structured data.
  repeated KeyValueItem key_value_items = 10;

  // Form elements detected in the document.
  repeated FormItem form_items = 11;

  // Regions of the document specifically for form fields.
  repeated FieldRegionItem field_regions = 14;

  // Individual form field items.
  repeated FieldItem field_items = 15;

  // Map of page numbers to page metadata.
  map<int32, PageItem> pages = 12;

  // Fields 16 and up extend the model beyond the upstream dialect; the
  // renderers that produce that dialect ignore them.

  // Source-declared document metadata (title, authors, dates, language).
  optional DocumentMeta source_meta = 16;

  // Nested payloads the source carries (mail parts, embedded files, page
  // attachments), addressable for fan-out parsing.
  repeated SubDocumentRef attachments = 17;

  // The source's own table of contents, when it declares one.
  repeated OutlineEntry outline = 18;

  // Page-level meta tags for web sources (name/content pairs).
  repeated MetaTag meta_tags = 19;

  // Machine-readable structured data blocks embedded in the source
  // (JSON-LD, microdata, OpenGraph), verbatim.
  repeated StructuredData structured_data = 20;

  // Media stream metadata for audio and video sources.
  optional MediaMeta media = 21;

  // Tracked changes the source records (insertions, deletions, format
  // edits), each anchored to the content it touches.
  repeated ChangeRecord changes = 22;

  // Named anchors the source declares (bookmarks, reference marks), the
  // targets its own cross-references point at.
  repeated NamedAnchor anchors = 23;

  // Message envelope for mail sources.
  optional EmailMeta email = 24;

  // Named page styles the source declares; pages point at them by name.
  repeated PageStyle page_styles = 25;

  // Named and database ranges a spreadsheet declares.
  repeated NamedRange named_ranges = 26;

  // Pivot table definitions a spreadsheet declares.
  repeated PivotSpec pivots = 27;
  // Every collector's own document-level account, kept whole beside the
  // resolved view above. Where two collectors answered one field, the
  // resolved field carries the winner and names it in `field_sources`;
  // the loser's answer is here, under its collector, not lost. Extension
  // beyond the upstream dialect.
  repeated CollectorClaim claims = 28;
}

// DocumentOrigin contains metadata about the source document file.
message DocumentOrigin {
  // MIME type of the source file
  string mimetype = 1;

  // Unsigned 64-bit hash of the source file for integrity verification.
  uint64 binary_hash = 2;

  // Original filename of the source document
  string filename = 3;

  // Optional URI/URL where the document was retrieved from
  optional string uri = 4;

  // Web retrieval provenance for crawled sources (extension beyond the
  // upstream dialect).
  optional WebMeta web = 5;

  // The source's own file identifier (a PDF /ID), hex-encoded.
  optional string source_id = 6;

  // What the mimetype claim rests on (extension, sniffed magic, declared
  // header), when the producer records it.
  optional string mimetype_evidence = 7;
  // Which collector's answer each resolved singular field carries.
  // Extension beyond the upstream dialect.
  repeated FieldSource field_sources = 8;
}

// ContentLayer defines the semantic layer where content appears in the document.
enum ContentLayer {
  CONTENT_LAYER_UNSPECIFIED = 0;
  CONTENT_LAYER_BODY = 1;
  CONTENT_LAYER_FURNITURE = 2;
  CONTENT_LAYER_BACKGROUND = 3;
  CONTENT_LAYER_INVISIBLE = 4;
  CONTENT_LAYER_NOTES = 5;
}

// GroupLabel defines the semantic type of a group in the document hierarchy.
enum GroupLabel {
  GROUP_LABEL_UNSPECIFIED = 0;
  GROUP_LABEL_LIST = 1;
  GROUP_LABEL_ORDERED_LIST = 2;
  GROUP_LABEL_CHAPTER = 3;
  GROUP_LABEL_SECTION = 4;
  GROUP_LABEL_SHEET = 5;
  GROUP_LABEL_SLIDE = 6;
  GROUP_LABEL_FORM_AREA = 7;
  GROUP_LABEL_KEY_VALUE_AREA = 8;
  GROUP_LABEL_COMMENT_SECTION = 9;
  GROUP_LABEL_INLINE = 10;
  GROUP_LABEL_PICTURE_AREA = 11;
}

// GroupItem represents a logical grouping of document elements.
message GroupItem {
  string self_ref = 1;
  optional RefItem parent = 2;
  repeated RefItem children = 3;
  ContentLayer content_layer = 4;
  optional BaseMeta meta = 5;
  optional string name = 6;
  GroupLabel label = 7;
  // Raw label fallback for forward-compatibility with newer label vocabularies.
  optional string label_raw = 8;
  // Sheet attributes when this group is a spreadsheet sheet (extension
  // beyond the upstream dialect).
  optional SheetMeta sheet = 9;
}

// RefItem is a JSON Pointer reference to another item in the document.
message RefItem {
  string ref = 1;
}

// IntSpan represents a half-open integer range [start, end).
// Used for character spans, fine-reference ranges, and similar positional pairs.
message IntSpan {
  int32 start = 1;
  int32 end = 2;
}

// FloatPair represents a pair of floating-point values.
// Used for 2D coordinates in chart data (e.g., scatter points, line values).
message FloatPair {
  double first = 1;
  double second = 2;
}

// StringIntPair represents a (string, int) pair.
// Used for labeled integer values (e.g., stacked bar chart segments).
message StringIntPair {
  string key = 1;
  int32 value = 2;
}

// FineRef is a reference with optional span range info.
message FineRef {
  string ref = 1;
  optional IntSpan range = 2;
}

// TrackSource identifies a cue in a media track (audio, video, subtitles).
//
// The Pydantic model carries a `kind: Literal["track"]` discriminator field.
// On the wire, that role is played by the parent `SourceType` oneof tag:
// selecting `track` already identifies the variant. We deliberately omit a
// redundant `kind` string field here.
message TrackSource {
  double start_time = 1;
  double end_time = 2;
  optional string identifier = 3;
  optional string voice = 4;
}

// CollectorSource attributes an item to the parser collector that produced
// it. This is a pipestream extension over the upstream schema:
// upstream SourceType carries only media-track cues, while the
// scatter-gather pipeline needs every collector's output attributable so
// additive merges never collide silently. Sources never overwrite each
// other; choosing a winner among sources is a downstream concern.
message CollectorSource {
  // The collector that produced the item, for example "grparse",
  // "libreoffice", "poi", "calamine".
  string collector = 1;
  // The engine or model inside the collector that produced the item, for
  // example "rapidocr", "poppler-text", "slanet-plus", "picodet_layout".
  optional string model = 2;
  // The engine or model version when known.
  optional string version = 3;
  // The producer's confidence in this item, 0.0 to 1.0, when the engine
  // reports one.
  optional double confidence = 4;
  // The engine's own uncalibrated signal behind that confidence, verbatim,
  // with its kind named (avg_logprob, softmax, distance) so consumers never
  // mistake it for a probability.
  optional double raw_score = 5;
  optional string raw_score_kind = 6;
  // How many samples the score aggregates, so a three-token mean and a
  // three-thousand-token mean stay distinguishable.
  optional uint64 raw_score_samples = 7;
}

// FieldSource names the collector whose answer a resolved singular field
// carries. `field` is the field's name on the message that holds this
// list, dotted through nested messages ("web.canonical_uri"); it is a
// schema identifier, never free text. Extension beyond the upstream
// dialect.
message FieldSource {
  string field = 1;
  CollectorSource source = 2;
}

// CollectorClaim is one collector's whole document-level account, kept
// beside the resolved view so a value that lost the resolution is still
// on the wire under the collector that gave it. Extension beyond the
// upstream dialect.
message CollectorClaim {
  CollectorSource source = 1;
  optional DocumentMeta source_meta = 2;
  optional DocumentOrigin origin = 3;
  repeated PageStyle page_styles = 4;
  optional EmailMeta email = 5;
  optional MediaMeta media = 6;
}

// SourceType is a union of possible source descriptors.
message SourceType {
  oneof source {
    TrackSource track = 1;
    CollectorSource collector = 2;
    // Model-generated content names its generation (extension beyond the
    // upstream dialect).
    GenerationSource generation = 3;
  }
}

// BaseMeta contains metadata fields common to most document items.
message BaseMeta {
  optional SummaryMetaField summary = 1;
  optional LanguageMetaField language = 2;
  optional EntitiesMetaField entities = 3;
  optional KeywordsMetaField keywords = 4;
  optional TopicsMetaField topics = 5;
  // Alternate readings a generative engine offered for spans of this item;
  // extension beyond the upstream dialect.
  optional AlternativesMetaField alternatives = 6;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// SummaryMetaField contains an AI-generated text summary with confidence.
message SummaryMetaField {
  optional double confidence = 1;
  optional string created_by = 2;
  string text = 3;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// LanguageMetaField contains detected human language metadata.
message LanguageMetaField {
  optional double confidence = 1;
  optional string created_by = 2;
  HumanLanguageLabel code = 3;
  // Raw code fallback for forward-compatibility with newer language vocabularies.
  optional string code_raw = 4;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// EntityMention is a named entity extracted from text content.
message EntityMention {
  optional double confidence = 1;
  optional string created_by = 2;
  string text = 3;
  optional string orig = 4;
  optional string label = 5;
  optional IntSpan charspan = 6;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// EntitiesMetaField groups extracted entity mentions.
message EntitiesMetaField {
  repeated EntityMention mentions = 1;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// KeywordsMetaField groups salient keyword or keyphrase strings for a node.
message KeywordsMetaField {
  repeated string values = 1;
  map<string, google.protobuf.Value> custom_fields = 100;
}

// TopicsMetaField groups higher-level subject or theme labels for a node.
message TopicsMetaField {
  repeated string values = 1;
  map<string, google.protobuf.Value> custom_fields = 100;
}

