// SPDX-License-Identifier: Apache-2.0
//
// Value types for the grpc-xml collector.
//
// The service reads JATS, USPTO, XBRL and DocLang XML and streams typed
// document items as the parser yields them. These messages are the payloads
// of that stream; the RPCs and their envelopes live in `xml_service.proto`.
//
// The model is deliberately a *collector* model, not a second Document
// schema: item labels mirror `ai.pipestream.document.v1.DocItemLabel` by
// name so gRParse can fold a stream into a Document without a translation
// table, and everything the XML says that does not fit a label is carried
// verbatim in `role`, `path` and `attributes` rather than dropped.

syntax = "proto3";

package ai.pipestream.xml.v1;

option java_multiple_files = true;
option java_outer_classname = "XmlProto";
option java_package = "ai.pipestream.xml.v1";

// XmlDialect selects the declarative XML family a document belongs to.
//
// One process serves all of them; the dialect decides which mapper runs, and
// it is either stated on the request or sniffed. Archive dialects are sniffed
// from their magic bytes before any XML is read; XML dialects are sniffed
// from the prolog and root element. Dialects outside this list are refused
// with `UNIMPLEMENTED`: this service is not a generic XML-to-Document
// converter.
enum XmlDialect {
  // Not stated. On a request this means "sniff"; the server never reports
  // it back on a successful parse.
  XML_DIALECT_UNSPECIFIED = 0;

  // NISO JATS journal article XML (`.xml` / `.nxml`), namespace
  // `http://jats.nlm.nih.gov` or an NLM/JATS DOCTYPE public identifier.
  XML_DIALECT_JATS = 1;

  // USPTO patent grant and application XML, the WIPO ST.36 / ST.96 families
  // (`us-patent-grant`, `us-patent-application`, `patent-document`).
  XML_DIALECT_USPTO = 2;

  // XBRL instance documents, namespace
  // `http://www.xbrl.org/2003/instance` (`.xbrl` / `.xml`).
  XML_DIALECT_XBRL = 3;

  // Docling DocLang XML (`.dclg`), a document tree that is already close to
  // the Document plane and needs only a typed decode.
  XML_DIALECT_DOCLANG = 4;

  // Docling DocLang archive (`.dclx`), a ZIP whose root `document.xml`
  // member is a DocLang document; `assets/` and `pages/` members carry
  // images this service never decodes. The inner document is mapped exactly
  // as `XML_DIALECT_DOCLANG` maps it.
  XML_DIALECT_DCLX = 5;

  // Google Books export (`.tar.gz`), a gzipped tar holding one METS
  // manifest with `PROFILE="gbs"` plus per-page hOCR files. Pages map in
  // manifest order, one text item per OCR line.
  XML_DIALECT_METS_GBS = 6;
}

// XmlItemLabel classifies one streamed text item.
//
// Names mirror `ai.pipestream.document.v1.DocItemLabel` so a coordinator can
// map them one to one. Only the labels the mapped dialects can produce are
// listed; a dialect-specific refinement that has no label of its own (an
// abstract paragraph, a patent claim, an author name, an OCR line) keeps a
// generic label and states the refinement in `TextItem.role`.
enum XmlItemLabel {
  // No label was determined. Treat as free text.
  XML_ITEM_LABEL_UNSPECIFIED = 0;

  // The document title.
  XML_ITEM_LABEL_TITLE = 1;

  // A section heading. `TextItem.level` carries its depth.
  XML_ITEM_LABEL_SECTION_HEADER = 2;

  // A body paragraph.
  XML_ITEM_LABEL_PARAGRAPH = 3;

  // Text that is not a paragraph and has no more specific label, such as an
  // author name or a keyword.
  XML_ITEM_LABEL_TEXT = 4;

  // One item of a list.
  XML_ITEM_LABEL_LIST_ITEM = 5;

  // A caption attached to a table or figure.
  XML_ITEM_LABEL_CAPTION = 6;

  // A bibliographic reference entry.
  XML_ITEM_LABEL_REFERENCE = 7;

  // A footnote.
  XML_ITEM_LABEL_FOOTNOTE = 8;

  // A code or preformatted block.
  XML_ITEM_LABEL_CODE = 9;

  // A mathematical formula, kept as its source text.
  XML_ITEM_LABEL_FORMULA = 10;

  // A picture or figure placeholder. XML dialects carry a reference rather
  // than pixels, so the item's text is the alt text or figure label.
  XML_ITEM_LABEL_PICTURE = 11;
}

// CollectorSource attributes an item to the collector that produced it.
//
// Field names and semantics match `ai.pipestream.document.v1.CollectorSource`
// so gRParse can attach it unchanged. Sources never overwrite each other: a
// PDF collector parsing the same paper contributes its own source.
message CollectorSource {
  // Always `xml` for this service.
  string collector = 1;

  // The mapper that produced the item: `jats`, `uspto`, `xbrl`, `doclang`,
  // `dclx` or `mets-gbs`.
  optional string model = 2;

  // Version of this server, as reported by `GetServiceInfo`.
  optional string version = 3;

  // Producer confidence, 0.0 to 1.0. Unset here: a declarative XML mapping
  // is deterministic, so claiming a confidence would be noise.
  optional double confidence = 4;
}

// XmlInfo is the resolved identity of the document, sent before any content.
//
// It is the first event of every successful parse, so a UI can title the
// view and pick a renderer before the first paragraph arrives. For an
// archive dialect the root fields describe the XML document inside the
// archive: the `document.xml` member of a DocLang archive, the METS
// manifest of a Google Books export.
message XmlInfo {
  // The dialect the rest of the stream was mapped with. Never
  // `XML_DIALECT_UNSPECIFIED`.
  XmlDialect dialect = 1;

  // How the dialect was decided, for debugging a surprising mapping.
  DialectEvidence evidence = 2;

  // Namespace URI of the root element, empty when the root is unqualified.
  string root_namespace = 3;

  // Local name of the root element, for example `article` or `xbrl`.
  string root_local_name = 4;

  // Root name declared by the DOCTYPE, when the document has one.
  optional string doctype_name = 5;

  // DOCTYPE public identifier, when present. Recorded for provenance and
  // used for sniffing; it is never dereferenced.
  optional string public_id = 6;

  // DOCTYPE system identifier, when present. Recorded only. This server
  // performs no DTD, XInclude or schema retrieval of any kind, so a
  // `file://` or `http://` system identifier is inert.
  optional string system_id = 7;

  // Document title, when the dialect exposes one in a position the parser
  // has already passed. Absent when the title has not been seen yet; the
  // title still arrives as a `TextItem` with `XML_ITEM_LABEL_TITLE`.
  optional string title = 8;

  // Character encoding named in the XML declaration, when present.
  optional string encoding = 9;

  // Version named in the XML declaration, for example `1.0`.
  optional string xml_version = 10;

  // Every attribute of the root element except its namespace declarations,
  // as written. The root never becomes a `TextItem`, so this is the only
  // place JATS `@article-type` and `@dtd-version`, USPTO `@lang`,
  // `@country` and `@date-produced`, and METS `@PROFILE` reach the wire.
  // Unlike `TextItem.attributes` these do not wait for
  // `ParseOptions.include_attributes`: there is no item to attach them to.
  repeated Attribute root_attributes = 11;

  // Prefix-to-URI bindings declared on the root element. `TextItem.path` is
  // written in qualified names, so without these a path is not portably
  // resolvable and two documents that bind the same prefix to different
  // URIs are indistinguishable.
  repeated NamespaceBinding namespaces = 12;

  // Schema documents the root associates with the instance, decoded from
  // `xsi:schemaLocation` and `xsi:noNamespaceSchemaLocation`. This is the
  // modern schema-identification signal, the counterpart to the DOCTYPE
  // public and system identifiers above. Recorded, never dereferenced.
  repeated SchemaLocation schema_locations = 13;

  // Value of the root element's `xml:lang`, when it declares one.
  optional string language = 14;
}

// NamespaceBinding is one namespace declaration, as the document wrote it.
message NamespaceBinding {
  // Prefix being bound. Empty for the default declaration (`xmlns=`).
  string prefix = 1;

  // Namespace URI the prefix binds to. Empty undeclares the prefix.
  string uri = 2;
}

// SchemaLocation is one namespace-to-schema-document pair.
//
// `xsi:schemaLocation` writes these as a whitespace-separated sequence of
// alternating namespaces and locations; they are decoded into pairs here so
// a consumer does not have to re-split a string that has two meanings.
message SchemaLocation {
  // Namespace URI the schema document describes. Empty when the pair came
  // from `xsi:noNamespaceSchemaLocation`, which names a schema for
  // unqualified content.
  string namespace = 1;

  // Location of the schema document, as written. This server performs no
  // schema retrieval of any kind, so the value is inert.
  string location = 2;
}

// DialectEvidence names the signal that resolved the dialect.
enum DialectEvidence {
  // Not stated.
  DIALECT_EVIDENCE_UNSPECIFIED = 0;

  // The request named the dialect explicitly; no sniffing ran.
  DIALECT_EVIDENCE_REQUESTED = 1;

  // Matched on the root element's namespace URI.
  DIALECT_EVIDENCE_ROOT_NAMESPACE = 2;

  // Matched on the DOCTYPE public identifier.
  DIALECT_EVIDENCE_PUBLIC_ID = 3;

  // Matched on a well-known root element local name.
  DIALECT_EVIDENCE_ROOT_ELEMENT = 4;

  // Matched on the payload's archive magic bytes (ZIP or gzip), which are
  // read before any XML sniffing because an archived document is not XML at
  // byte 0.
  DIALECT_EVIDENCE_ARCHIVE_MAGIC = 5;
}

// Attribute is one source attribute carried through verbatim.
message Attribute {
  // Attribute name as written, including any prefix (`xlink:href`).
  string name = 1;

  // Attribute value after XML escape resolution of predefined and character
  // references only. General entity references are never expanded.
  string value = 2;
}

// SpanStyle names one character-level style a source applies to a run of
// text. The set is the union of what the mapped dialects can say, not a
// rendering model: a consumer that cannot express one ignores it.
enum SpanStyle {
  // Not stated.
  SPAN_STYLE_UNSPECIFIED = 0;

  // Bold weight (`bold`, `b`).
  SPAN_STYLE_BOLD = 1;

  // Italic or emphasized (`italic`, `i`, `em`).
  SPAN_STYLE_ITALIC = 2;

  // Underlined (`underline`, `u`).
  SPAN_STYLE_UNDERLINE = 3;

  // Struck through (`strike`, `s`).
  SPAN_STYLE_STRIKETHROUGH = 4;

  // Fixed-pitch (`monospace`, `code`).
  SPAN_STYLE_MONOSPACE = 5;

  // Raised (`sup`).
  SPAN_STYLE_SUPERSCRIPT = 6;

  // Lowered (`sub`).
  SPAN_STYLE_SUBSCRIPT = 7;

  // Small capitals (`sc`).
  SPAN_STYLE_SMALL_CAPS = 8;

  // Mathematical notation carried as source text (`inline-formula`,
  // `tex-math`, MathML).
  SPAN_STYLE_MATH = 9;
}

// ReferenceKind names what an intra-document reference points at, from the
// source's own statement of it (`ref-type` in JATS, the element name in
// USPTO). It is never inferred from the target.
enum ReferenceKind {
  // The source did not say.
  REFERENCE_KIND_UNSPECIFIED = 0;

  // A bibliographic citation (`ref-type="bibr"`).
  REFERENCE_KIND_CITATION = 1;

  // A reference with no more specific kind.
  REFERENCE_KIND_CROSS_REF = 2;

  // A footnote anchor (`ref-type="fn"`).
  REFERENCE_KIND_FOOTNOTE = 3;

  // A figure (`ref-type="fig"`).
  REFERENCE_KIND_FIGURE = 4;

  // A table (`ref-type="table"`).
  REFERENCE_KIND_TABLE = 5;

  // Another claim of the same patent (`claim-ref`).
  REFERENCE_KIND_CLAIM = 6;

  // A displayed formula (`ref-type="disp-formula"`).
  REFERENCE_KIND_EQUATION = 7;

  // A section of the same document (`ref-type="sec"`).
  REFERENCE_KIND_SECTION = 8;
}

// IntRange is a half-open range of Unicode scalar values, `[start, end)`.
//
// Positions count code points rather than bytes so a consumer can index the
// string it already has without decoding UTF-8 offsets.
message IntRange {
  // First code point of the run, zero-based and inclusive.
  uint32 start = 1;

  // One past the last code point of the run.
  uint32 end = 2;
}

// InlineSpan is one run of an item's text that the flat string cannot
// describe: emphasis, a hyperlink, or a cross-reference.
//
// Ranges index `TextItem.text` after flattening and whitespace collapse, so
// they address the string the consumer received rather than the source
// bytes. Spans nest and overlap exactly as the source elements do; they are
// sent in the order their elements opened. Only sent when
// `ParseOptions.emit_inline_spans` is set.
message InlineSpan {
  // The run this span covers.
  IntRange range = 1;

  // Character styles the source applies to the run. Empty for a run that is
  // only a link or a reference.
  repeated SpanStyle styles = 2;

  // Target of an external link (`ext-link`, `uri`, `email`), as written. A
  // bare email address is normalized to a `mailto:` URI.
  optional string hyperlink = 3;

  // Identifiers this run references inside the same document, as written:
  // JATS `xref/@rid`, USPTO `claim-ref/@idref`. A source may name several
  // in one reference, so this is a list rather than a joined string.
  repeated string references = 4;

  // What `references` points at, when the source says.
  ReferenceKind reference_kind = 5;

  // Qualified name of the source element that produced the run.
  string element_name = 6;

  // Resolved namespace URI of that element, empty when unqualified.
  string namespace = 7;

  // Attributes of the span element, when `ParseOptions.include_attributes`
  // is set. Empty otherwise.
  repeated Attribute attributes = 8;
}

// Alignment names how a table column or cell places its content
// horizontally, as the source declares it. It is never inferred from the
// content.
enum Alignment {
  // The source declares none.
  ALIGNMENT_UNSPECIFIED = 0;

  // Flush left (`align="left"`).
  ALIGNMENT_LEFT = 1;

  // Centered (`align="center"`).
  ALIGNMENT_CENTER = 2;

  // Flush right (`align="right"`).
  ALIGNMENT_RIGHT = 3;

  // Justified (`align="justify"`).
  ALIGNMENT_JUSTIFY = 4;

  // Aligned on a nominated character, which CALS spells `align="char"` and
  // qualifies with `@char`. Kept because a CALS table really does declare it
  // and reading it as "unspecified" would misreport the source; the Document
  // plane has no member for it, so the projection leaves the slot unset.
  ALIGNMENT_CHAR = 5;
}

// VerticalAlignment names how a table column or cell places its content
// vertically. Separate from `Alignment` because a source declares the two
// axes in two attributes and a merged enum lets a vertical value land in a
// horizontal slot.
enum VerticalAlignment {
  // The source declares none.
  VERTICAL_ALIGNMENT_UNSPECIFIED = 0;

  // Flush to the top of the cell (`valign="top"`).
  VERTICAL_ALIGNMENT_TOP = 1;

  // Centered in the cell (`valign="middle"`).
  VERTICAL_ALIGNMENT_MIDDLE = 2;

  // Flush to the bottom of the cell (`valign="bottom"`).
  VERTICAL_ALIGNMENT_BOTTOM = 3;
}

// ColumnSpec is one column's declared geometry, in column order.
//
// A CALS `colspec` and an XHTML `col` both declare the column rather than any
// cell in it, and both are children of the table element, which is why these
// ride on `TableEnd` rather than on `TableStart`: the table has already
// opened by the time the source states them.
message ColumnSpec {
  // The column's name as the source declares it (`colspec/@colname`), which
  // a cell addresses it by. Empty when the source names no column.
  string name = 1;

  // The column's declared width, verbatim in the source's own units (`2*`,
  // `5cm`, `30%`). Empty when the source declares none. Kept as written: a
  // CALS proportional width is a share of the table, not a length, and
  // resolving it here would be inventing a page.
  string width = 2;

  // Horizontal alignment the source declares for the column.
  Alignment align = 3;

  // Vertical alignment the source declares for the column.
  VerticalAlignment valign = 4;
}

// BoundingBox is a rectangle in the source's own page coordinates.
//
// The origin is the top left corner and `bottom` is the larger of the two
// vertical values, which is how hOCR writes a `bbox` clause. Units are the
// page's own; `Page.unit` names them.
message BoundingBox {
  // Distance from the left edge to the box's left side.
  double left = 1;

  // Distance from the top edge to the box's top side.
  double top = 2;

  // Distance from the left edge to the box's right side.
  double right = 3;

  // Distance from the top edge to the box's bottom side.
  double bottom = 4;
}

// WordBox is one recognized word of an OCR line and where it sits.
//
// hOCR marks each word with its own box and its own confidence
// (`ocrx_word`), and a line's box bounds the whole line, so the word boxes
// are the only thing in the format that says where inside a line a word is.
// A consumer that wants to highlight a search hit on the page scan needs
// exactly this and can get it nowhere else.
message WordBox {
  // The word's run in the owning `TextItem.text`, counted in Unicode scalar
  // values so a consumer slices the string it already has. Measured against
  // the collapsed text the item carries, not against the source.
  IntRange range = 1;

  // The word's box, in the coordinates the preceding `Page` event names.
  BoundingBox bbox = 2;

  // The word's own OCR confidence, 0.0 to 1.0, when the source states one
  // for the word rather than only for the line.
  optional double confidence = 3;
}

// Page announces one page of an archive dialect, before the items on it.
//
// Only the archive dialects have pages: a single XML document has none, and
// this event is not sent for one. It carries no stream index, because the
// index series counts content items and a page is a container.
message Page {
  // Page number, 1-based. For a Google Books export this is the manifest
  // `ORDER` attribute, which is why it is the source's number rather than a
  // running count.
  uint32 page_no = 1;

  // Page width in `unit`, when the source states the page's extent.
  optional double width = 2;

  // Page height in `unit`.
  optional double height = 3;

  // Unit the page's extent and every box on it is measured in. `px` for
  // hOCR, which counts image pixels.
  string unit = 4;

  // Archive member the page was read from, for tracing a box back to the
  // file that stated it.
  optional string member = 5;

  // Provenance, always set.
  CollectorSource source = 6;
}

// TextItem is one streamed unit of text, in document order.
//
// This is the workhorse event: titles, headings, paragraphs, list items,
// captions, references, patent claims and author names all arrive as
// `TextItem`, distinguished by `label` and refined by `role`.
message TextItem {
  // Zero-based index of this item within the stream, counting every
  // `TextItem`, `TableStart` and `Fact`. Stable within one parse only.
  uint64 index = 1;

  // Structural label.
  XmlItemLabel label = 2;

  // Dialect-specific refinement of `label`, an open vocabulary: `abstract`,
  // `claim`, `author`, `inventor`, `keyword`, `description`,
  // `drawing-description`, `affiliation`, `doi`, `ocr-line`. Empty when the
  // label says everything.
  string role = 3;

  // The item's text: descendant character data concatenated in document
  // order, with inline markup flattened away and runs of whitespace
  // collapsed. Never empty.
  string text = 4;

  // Heading depth for `XML_ITEM_LABEL_SECTION_HEADER`, starting at 1.
  // Absent for every other label.
  optional uint32 level = 5;

  // Position of the item within its numbered series when the source
  // numbers it: a patent claim number, a list item number, a reference
  // number. Absent when the source does not number it.
  optional uint64 ordinal = 6;

  // Location of the source element, as a positional path from the document
  // root: `/article/body/sec[2]/p[3]`. Prefix-free of namespaces, because
  // it addresses the serialized document rather than the infoset.
  string path = 7;

  // Value of the element's `id` or `xml:id` attribute, when it has one.
  optional string element_id = 8;

  // Attributes of the source element that the mapping did not consume,
  // preserved so nothing observable is silently discarded.
  repeated Attribute attributes = 9;

  // Provenance, always set.
  CollectorSource source = 10;

  // Character-level runs inside `text`: emphasis, hyperlinks and
  // cross-references that flattening would otherwise destroy. Only
  // populated when `ParseOptions.emit_inline_spans` is set.
  repeated InlineSpan spans = 11;

  // Where the item sits on its page, in the coordinates the preceding
  // `Page` event names. Set only by the dialects that have real
  // coordinates, which today means the hOCR pages of a Google Books
  // export; a single XML document has no geometry and claims none.
  optional BoundingBox bbox = 12;

  // Page the item is on, matching a `Page.page_no`. Set with `bbox`.
  optional uint32 page_no = 13;

  // Qualified name of the source element that produced the item, as written
  // (`article-title`, `mml:math`). `path` locates the element and this names
  // it, which is what a consumer matching on the source vocabulary needs
  // without re-splitting a path. Empty for an item the archive drivers
  // synthesize rather than read from one element.
  string element_name = 14;

  // Resolved namespace URI of that element, empty when it is unqualified.
  string namespace = 15;

  // Where the item's element sits in the byte stream the parser read: the
  // offset of the first byte of its start tag, and the offset one past the
  // last byte of its end tag. Both count bytes of the UTF-8 the parser
  // consumed, which is the source itself for a UTF-8 document and the
  // decoded form of it for any other, so a document in another encoding
  // gives a faithful position in the decoded stream rather than a wrong one
  // in the source. Absent for the archive dialects, whose items come from
  // many member documents and have no offset into the payload the caller
  // uploaded.
  optional uint64 byte_start = 16;

  // One past the last byte of the item's element. Set with `byte_start`.
  optional uint64 byte_end = 17;

  // True when any part of `text` came from a CDATA section rather than from
  // ordinary character data. The text is identical either way; what differs
  // is that the source declared it exempt from markup, which is worth
  // knowing about a fragment that contains angle brackets.
  bool from_cdata = 18;

  // For `XML_ITEM_LABEL_LIST_ITEM`: how deeply the list this item belongs to
  // is nested, starting at 1 for a list that is not inside another. Absent
  // for every other label, and absent for a list item whose dialect has no
  // list container to count.
  optional uint32 list_depth = 19;

  // For `XML_ITEM_LABEL_LIST_ITEM`: true when the list the item belongs to
  // is an ordered one, as the source declares the *list* (a JATS
  // `list/@list-type`, an `ol` element). This is a different statement from
  // `ordinal`, which is the number the source gave this one item: a source
  // may declare an ordered list and number none of its items, or number an
  // item in a list it never called ordered.
  bool enumerated = 20;

  // Per-word boxes inside this item, in reading order. Only the archive
  // dialects have these, and only when the source marks words: hOCR does,
  // with `ocrx_word`. Empty everywhere else.
  repeated WordBox words = 21;
}

// TableStart opens a streamed table. Rows follow, then `TableEnd`.
message TableStart {
  // Stream index, in the same series as `TextItem.index`.
  uint64 index = 1;

  // Identifier used by the `TableRow` and `TableEnd` events of this table.
  // Unique within one parse.
  string table_ref = 2;

  // Caption text, when the source carries one *before* the table body.
  // A caption that follows the body arrives as a `TextItem` with
  // `XML_ITEM_LABEL_CAPTION` instead, because the table has already
  // streamed by then.
  optional string caption = 3;

  // Positional path of the source table element.
  string path = 4;

  // Value of the table element's `id` attribute, when it has one.
  optional string element_id = 5;

  // Provenance, always set.
  CollectorSource source = 6;
}

// TableCell is one cell of a streamed table row.
message TableCell {
  // Zero-based column index, advanced by the column spans before it.
  uint32 column_index = 1;

  // Cell text, flattened the same way as `TextItem.text`. May be empty.
  string text = 2;

  // Columns this cell spans, from the source `colspan`. At least 1.
  uint32 column_span = 3;

  // Rows this cell spans, from the source `rowspan`. At least 1.
  uint32 row_span = 4;

  // True when the source marks the cell as a header (`th`, or a cell inside
  // `thead`).
  bool is_header = 5;

  // Character-level runs inside `text`, the same vocabulary
  // `TextItem.spans` carries: emphasis, hyperlinks and cross-references that
  // flattening would otherwise destroy. Ranges index this cell's `text`.
  // Only populated when `ParseOptions.emit_inline_spans` is set.
  repeated InlineSpan spans = 6;

  // Horizontal alignment the source declares on the cell itself, which
  // overrides the column's. `ALIGNMENT_UNSPECIFIED` when it declares none.
  Alignment align = 7;

  // Vertical alignment the source declares on the cell itself, which
  // overrides the column's.
  VerticalAlignment valign = 8;
}

// TableRow is one row of a table, emitted as soon as its end tag is read.
message TableRow {
  // The table this row belongs to, matching `TableStart.table_ref`.
  string table_ref = 1;

  // Zero-based row index within the table.
  uint32 row_index = 2;

  // True when the row sits inside `thead`, or when every cell is a header
  // cell.
  bool is_header = 3;

  // The row's cells in column order. Never empty.
  repeated TableCell cells = 4;
}

// TableEnd closes a streamed table.
message TableEnd {
  // The table being closed, matching `TableStart.table_ref`.
  string table_ref = 1;

  // Number of `TableRow` events sent for this table.
  uint32 row_count = 2;

  // Widest row of the table, in columns after span expansion.
  uint32 column_count = 3;

  // The column geometry the source declares, in column order: a CALS
  // `colspec` sequence, an XHTML `colgroup`. Empty when the source declares
  // none, and shorter than `column_count` when it declares only some. This
  // rides on the closing event rather than on `TableStart` because both
  // spellings are children of the table element: the table has already
  // opened by the time the source states them, and holding the table back
  // until they are read would trade the live stream for one attribute.
  repeated ColumnSpec columns = 4;
}

// XbrlPeriod is the reporting period of an XBRL context.
message XbrlPeriod {
  // Point-in-time date (`instant`), as written in the instance.
  optional string instant = 1;

  // Inclusive start of a duration (`startDate`).
  optional string start_date = 2;

  // Inclusive end of a duration (`endDate`).
  optional string end_date = 3;

  // True when the period is `forever`.
  bool forever = 4;
}

// XbrlDimension is one explicit or typed dimension of a context's segment or
// scenario.
message XbrlDimension {
  // Qualified name of the dimension axis, as written (`us-gaap:StatementScenarioAxis`).
  string dimension = 1;

  // Qualified name of the member, for an explicit dimension.
  optional string member = 2;

  // Serialized content of a typed dimension, when the dimension is typed
  // rather than explicit.
  optional string typed_value = 3;

  // True when the dimension came from `scenario`, false when from `segment`.
  bool is_scenario = 4;
}

// XbrlContext is a resolved `context` element of an XBRL instance.
message XbrlContext {
  // The context `id`, referenced by `Fact.context_ref`.
  string id = 1;

  // Scheme URI of the reporting entity identifier.
  optional string entity_scheme = 2;

  // The reporting entity identifier itself, for example a CIK or LEI.
  optional string entity_identifier = 3;

  // The reporting period.
  XbrlPeriod period = 4;

  // Segment and scenario dimensions, in document order.
  repeated XbrlDimension dimensions = 5;
}

// XbrlUnit is a resolved `unit` element of an XBRL instance.
message XbrlUnit {
  // The unit `id`, referenced by `Fact.unit_ref`.
  string id = 1;

  // Measures of a simple unit, as written (`iso4217:USD`, `xbrli:shares`).
  // Empty for a divide unit.
  repeated string measures = 2;

  // Numerator measures of a divide unit.
  repeated string numerator_measures = 3;

  // Denominator measures of a divide unit.
  repeated string denominator_measures = 4;
}

// Fact is one XBRL instance fact, emitted as its element closes.
//
// Facts stream in document order. Contexts and units are declared before the
// facts that use them in every conformant instance, so `context` and `unit`
// are normally resolved inline; when a reference is forward or dangling they
// are absent and only the `*_ref` string is set.
message Fact {
  // Stream index, in the same series as `TextItem.index`.
  uint64 index = 1;

  // Namespace URI of the concept element.
  string concept_namespace = 2;

  // Local name of the concept element, for example `Assets`.
  string concept_local_name = 3;

  // Element prefix as written in the instance, for example `us-gaap`.
  // Empty when the concept element is unprefixed.
  string concept_prefix = 4;

  // Human-readable label. In v1 this is always the local name: label
  // linkbase resolution is not implemented, so a supplied `taxonomy`
  // changes nothing here and raises a warning on the trailer.
  string label = 5;

  // Value of the `contextRef` attribute. Always present on a fact.
  string context_ref = 6;

  // The resolved context, when it was declared earlier in the instance.
  optional XbrlContext context = 7;

  // Value of the `unitRef` attribute, for numeric facts.
  optional string unit_ref = 8;

  // The resolved unit, when it was declared earlier in the instance.
  optional XbrlUnit unit = 9;

  // The fact's value as written, whitespace-collapsed. Empty for a nil fact.
  string value = 10;

  // Value of the `decimals` attribute, as written (`-6`, `INF`).
  optional string decimals = 11;

  // Value of the `precision` attribute, as written.
  optional string precision = 12;

  // True when the fact carries `xsi:nil="true"`.
  bool is_nil = 13;

  // Value of the `sign` attribute (`-`) when present.
  optional string sign = 14;

  // Positional path of the fact element.
  string path = 15;

  // Provenance, always set.
  CollectorSource source = 16;

  // Value of the fact element's `id` attribute, when it has one. This is
  // the anchor an `XbrlNote` points at, so a footnote can be attached to
  // the fact it annotates.
  optional string element_id = 17;
}

// XbrlNoteKind names which linkbase a note came from.
enum XbrlNoteKind {
  // Not stated.
  XBRL_NOTE_KIND_UNSPECIFIED = 0;

  // A `link:footnote` from a footnote linkbase inside the instance:
  // narrative attached to one or more facts.
  XBRL_NOTE_KIND_FOOTNOTE = 1;

  // A `link:label` from a label linkbase inside the instance: a
  // human-readable name for a concept.
  XBRL_NOTE_KIND_LABEL = 2;
}

// XbrlNote is one footnote or label declared inside an XBRL instance.
//
// These live in `link:footnoteLink` and `link:labelLink` elements, which are
// linkbase infrastructure by namespace and content by intent: a footnote is
// the narrative a filer attached to a number. They were consumed silently
// before, along with any XHTML they carry.
//
// A note carries no stream index: the index series counts content items.
message XbrlNote {
  // Which linkbase the note came from.
  XbrlNoteKind kind = 1;

  // The `xlink:label` the arcs address the note by, as written.
  string label = 2;

  // The `xlink:role` of the note, as written, naming what kind of footnote
  // or label it is.
  optional string role = 3;

  // Language of the note, from `xml:lang`.
  optional string language = 4;

  // What the note is attached to: the `xlink:href` of every locator an arc
  // connects to it. For a footnote these are fragment references to fact
  // `id` attributes (`#f-01`); for a label they reference concepts in a
  // schema. A note may annotate several targets, so this is a list.
  repeated string targets = 5;

  // The note's text, flattened and whitespace-collapsed.
  string text = 6;

  // Positional path of the note element.
  string path = 7;

  // Provenance, always set.
  CollectorSource source = 8;
}

// MetaDate is one date the document declares about itself.
//
// The parts are kept as the source wrote them, because a JATS `pub-date`
// with only a year is a real and common thing to say and rendering it as
// `2026-01-01` would invent two fields the document does not have.
message MetaDate {
  // The source's own name for the date, lower-cased: `epub`, `ppub`,
  // `collection` from a JATS `pub-date/@pub-type`, `received` or
  // `accepted` from a `history/date/@date-type`.
  string kind = 1;

  // Calendar year.
  optional uint32 year = 2;

  // Month, 1 to 12.
  optional uint32 month = 3;

  // Day of month, 1 to 31.
  optional uint32 day = 4;

  // The date as an ISO 8601 calendar date, set only when the source states
  // all three parts or writes the date out itself (`@iso-8601-date`).
  optional string iso_date = 5;
}

// MetaIdentifier is one identifier of the document or of the work that
// contains it.
message MetaIdentifier {
  // The identifier scheme, as the source names it: `doi`, `pmid`, `issn`,
  // `publisher-id`, `nlm-ta`.
  string kind = 1;

  // The identifier itself.
  string value = 2;

  // What the identifier identifies, when the source distinguishes: `ppub`
  // or `epub` for an ISSN, `journal` for a journal identifier.
  optional string scope = 3;
}

// MetaClassification is one classification code assigned to the document.
message MetaClassification {
  // The classification system: `cpc`, `ipcr`, `national`, or
  // `jats-subject` for a JATS subject term.
  string scheme = 1;

  // The code as the source writes it, joined from its parts for the
  // patent schemes that spell a code out across child elements.
  string code = 2;

  // Edition or version of the scheme, when stated.
  optional string edition = 3;

  // Issuing office or authority, when stated.
  optional string office = 4;
}

// MetaLicense is what the document says about reuse of itself.
message MetaLicense {
  // URI naming the licence, from a JATS `license/@xlink:href`.
  optional string type_uri = 1;

  // The licence text as written.
  optional string statement = 2;

  // The copyright line as written.
  optional string copyright_statement = 3;

  // Copyright year, as written.
  optional string copyright_year = 4;

  // Copyright holder, as written.
  optional string copyright_holder = 5;
}

// MetaFunding is one funding award or funding statement.
message MetaFunding {
  // Name of the funding source.
  optional string funder = 1;

  // Award, grant or contract identifier.
  optional string award_id = 2;

  // The funding statement as written, when the source gives prose instead
  // of, or as well as, the structured parts.
  optional string statement = 3;
}

// MetaCitation is one entry of a cited-reference list that is metadata
// rather than body content: a patent's references-cited block.
//
// A JATS reference list is body content and arrives as `TextItem` with
// `XML_ITEM_LABEL_REFERENCE` instead; this is for the lists a document
// carries in its bibliographic header.
message MetaCitation {
  // The entry's own identifier, when it has one.
  optional string element_id = 1;

  // Position in the list when the source numbers it.
  optional uint64 ordinal = 2;

  // The entry, flattened.
  string text = 3;
}

// MetaItem is one piece of the document's declaration about itself,
// recovered from a subtree the item mapping does not walk.
//
// These subtrees flatten into meaningless prose, which is why they are
// skipped by default; decoded into these shapes they are among the most
// valuable fields a journal article or a patent carries. Only sent when
// `ParseOptions.emit_source_metadata` is set.
//
// A `MetaItem` carries no stream index: the index series counts content
// items, and a publication date is not content.
message MetaItem {
  // Positional path of the source element.
  string path = 1;

  // Exactly one shape is set.
  oneof value {
    // A date the document declares.
    MetaDate date = 2;

    // An identifier of the document or its container.
    MetaIdentifier identifier = 3;

    // A classification code assigned to the document.
    MetaClassification classification = 4;

    // Licence and copyright terms.
    MetaLicense license = 5;

    // A funding award or statement.
    MetaFunding funding = 6;

    // One entry of a cited-reference block.
    MetaCitation citation = 7;
  }

  // Provenance, always set.
  CollectorSource source = 8;
}

// HtmlIsland is an XHTML fragment handed off rather than mapped.
//
// JATS bodies and XBRL footnotes and labels may embed XHTML. Re-parsing it
// with an XML stack would produce a worse result than the HTML collector
// gets, so the fragment is forwarded as opaque bytes with enough context to
// place the result back into the document.
message HtmlIsland {
  // Stream index, in the same series as `TextItem.index`.
  uint64 index = 1;

  // Positional path of the element that roots the island.
  string path = 2;

  // Value of the element's `id` attribute, when it has one.
  optional string element_id = 3;

  // Namespace URI the island was recognized by, normally
  // `http://www.w3.org/1999/xhtml`.
  string namespace = 4;

  // The fragment, re-serialized as UTF-8 XHTML including its root element.
  // Byte-for-byte re-serialization of the source is not promised; entity
  // references that this server refuses to expand are preserved verbatim.
  bytes html = 5;

  // Provenance, always set.
  CollectorSource source = 6;
}

// WarningCode classifies a non-fatal finding of the parse.
enum WarningCode {
  // Not stated.
  WARNING_CODE_UNSPECIFIED = 0;

  // A general entity reference was found in content and was not expanded,
  // because this server declares no entities and refuses declared ones. The
  // reference text is preserved verbatim in the item text.
  WARNING_CODE_UNEXPANDED_ENTITY = 1;

  // A DOCTYPE external identifier was present. It was recorded on `XmlInfo`
  // and not dereferenced.
  WARNING_CODE_EXTERNAL_ID_IGNORED = 2;

  // An element the mapper does not recognize was skipped. Its text, if any,
  // is not in the stream.
  WARNING_CODE_UNMAPPED_ELEMENT = 3;

  // A `Fact` referenced a context or unit that was never declared, so the
  // resolved message is absent.
  WARNING_CODE_DANGLING_REFERENCE = 4;

  // `taxonomy` bytes were supplied but not used: label linkbase resolution
  // is not implemented in v1.
  WARNING_CODE_TAXONOMY_IGNORED = 5;

  // Character data was found in an encoding the parser had to guess at, or
  // a malformed sequence was replaced.
  WARNING_CODE_ENCODING_SUBSTITUTION = 6;

  // An archive member was read past but not mapped: an image this service
  // never decodes, a manifest entry naming a member the archive does not
  // contain, or a page without OCR. The member still counts against the
  // decompressed byte cap.
  WARNING_CODE_ARCHIVE_MEMBER_IGNORED = 7;
}

// ParseWarning is one non-fatal finding, carried on the trailer.
message ParseWarning {
  // What kind of finding this is.
  WarningCode code = 1;

  // Human-readable detail, safe to log.
  string message = 2;

  // How many times this exact finding occurred. Findings are aggregated per
  // (code, message) pair so a document with ten thousand unexpanded
  // entities produces one warning, not ten thousand.
  uint64 count = 3;
}

// ParseCounts is the tally of what the stream carried.
message ParseCounts {
  // `TextItem` events sent.
  uint64 text_items = 1;

  // `TableStart` events sent, which is the number of tables.
  uint64 tables = 2;

  // `TableRow` events sent across all tables.
  uint64 table_rows = 3;

  // `Fact` events sent.
  uint64 facts = 4;

  // `HtmlIsland` events sent.
  uint64 html_islands = 5;

  // XBRL `context` elements resolved.
  uint64 contexts = 6;

  // XBRL `unit` elements resolved.
  uint64 units = 7;

  // XML elements the parser visited, including ones that produced nothing.
  uint64 elements_visited = 8;

  // Pages mapped from an archive manifest. Zero for the single-document
  // dialects, which have no page structure to count.
  uint64 pages = 9;

  // `MetaItem` events sent.
  uint64 meta_items = 10;

  // `XbrlNote` events sent.
  uint64 xbrl_notes = 11;
}

// ParseStatus is the trailer of a successful parse: the last event of the
// stream, never the payload.
//
// A parse that fails does not send `ParseStatus`; it ends the stream with a
// gRPC status instead (`INVALID_ARGUMENT` for malformed or truncated input,
// `RESOURCE_EXHAUSTED` past the byte cap, `UNIMPLEMENTED` for an
// unrecognized dialect, `INTERNAL` for a parser fault).
message ParseStatus {
  // The dialect the document was mapped with. Never
  // `XML_DIALECT_UNSPECIFIED`.
  XmlDialect dialect = 1;

  // What the stream carried.
  ParseCounts counts = 2;

  // Non-fatal findings, aggregated. May be empty.
  repeated ParseWarning warnings = 3;

  // Bytes consumed from the request stream: XML for the single-document
  // dialects, compressed archive bytes for the archive dialects.
  uint64 bytes_consumed = 4;

  // Wall-clock milliseconds from the first request frame to this trailer.
  uint64 elapsed_millis = 5;
}
