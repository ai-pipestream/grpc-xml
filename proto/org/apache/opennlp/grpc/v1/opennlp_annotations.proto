// A glossary entry matched in the text.
message GlossaryMatch {
  // The glossary entry id.
  string id = 1;
  // The canonical term of the entry.
  string term = 2;
  // The glossary, e.g. a configured resource id.
  string glossary_id = 3;
}

// ============================================================================
// Quantities and time
// ============================================================================

// A money amount.
message MoneyAmount {
  // Exact decimal amount as text, e.g. "1250.00"; never a binary float.
  string amount = 1;
  // ISO 4217 currency code, e.g. "USD".
  string currency = 2;
  // Set on a converted layer: the amount and currency as written in the text.
  optional string original_amount = 3;
  optional string original_currency = 4;
}

// A measured quantity.
message Quantity {
  // Exact decimal value as text.
  string value = 1;
  // The unit, e.g. "km", "kg", "%".
  string unit = 2;
}

// A temporal expression.
message TemporalExpression {
  // The normalized value, e.g. "2026-10-03", "2026-W40", "2026-Q4".
  string value = 1;
  TemporalGranularity granularity = 2;
  TemporalOrigin origin = 3;
}

enum TemporalGranularity {
  TEMPORAL_GRANULARITY_UNSPECIFIED = 0;
  TEMPORAL_GRANULARITY_DAY = 1;
  TEMPORAL_GRANULARITY_WEEK = 2;
  TEMPORAL_GRANULARITY_MONTH = 3;
  TEMPORAL_GRANULARITY_QUARTER = 4;
  TEMPORAL_GRANULARITY_YEAR = 5;
}

enum TemporalOrigin {
  TEMPORAL_ORIGIN_UNSPECIFIED = 0;
  // A fixed calendar reference in the text.
  TEMPORAL_ORIGIN_ABSOLUTE = 1;
  // Resolved against the document date ("next week").
  TEMPORAL_ORIGIN_RELATIVE = 2;
}

// A calendar date, used for the document date.
message CalendarDate {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

// ============================================================================
// Geography
// ============================================================================

// A place mention resolved against a gazetteer.
message PlaceResolution {
  GazetteerPlace place = 1;
  // Resolution confidence in [0, 1].
  double confidence = 2;
}

// A gazetteer record, mirroring opennlp.tools.geo.GazetteerEntry.
message GazetteerPlace {
  // The gazetteer, e.g. "geonames", "census".
  string source = 1;
  // The record id within the source.
  string record_id = 2;
  string name = 3;
  repeated string alternate_names = 4;
  GeoPoint location = 5;
  optional GeoBoundingBox bounding_box = 6;
  // ISO 3166-1 alpha-2 country code.
  optional string country_code = 7;
  // Enclosing place names, nearest first.
  repeated string containment = 8;
  int64 population = 9;
  PlaceFeatureClass feature_class = 10;
  // Cross-references keyed by scheme: "geonames", "wikidata", "whosonfirst",
  // "fips", "geoid", "zcta".
  map<string, PlaceAttribute> attributes = 11;
}

message GeoPoint {
  double latitude = 1;
  double longitude = 2;
}

message GeoBoundingBox {
  double west = 1;
  double south = 2;
  double east = 3;
  double north = 4;
}

enum PlaceFeatureClass {
  PLACE_FEATURE_CLASS_UNSPECIFIED = 0;
  PLACE_FEATURE_CLASS_CITY = 1;
  PLACE_FEATURE_CLASS_ADMIN = 2;
  PLACE_FEATURE_CLASS_POI = 3;
}

// One cross-reference value with where it came from.
message PlaceAttribute {
  string value = 1;
  string source = 2;
  optional string notes = 3;
}

// The administrative ancestry of a resolved place.
message ContainmentChain {
  // Ancestors, nearest first.
  repeated PlaceAncestor ancestors = 1;
}

message PlaceAncestor {
  string id = 1;
  string name = 2;
  // The ancestor's level, e.g. "county", "state", "country".
  string type = 3;
}

// One country's share of a document's region ballot. A region layer holds
// one document-scope annotation per candidate, highest share first.
message RegionVote {
  // ISO 3166-1 alpha-2 country code.
  string country_code = 1;
  // The candidate's share of the ballot, in [0, 1].
  double share = 2;
  // True for the candidate the annotator chose; no candidate is chosen when
  // the lead is below the configured margin.
  bool chosen = 3;
}

// ============================================================================
// Document level
// ============================================================================

// One language prediction. A language layer holds one document-scope
// annotation per prediction, best first; the probability is on Annotation.
message LanguageGuess {
  // ISO 639-3 code.
  string code = 1;
  // One-based rank.
  int32 rank = 2;
}

// A document category from a classifier.
message Category {
  string label = 1;
  // The classifier's score for the label.
  double score = 2;
  // True for the best category.
  bool best = 3;
}

// A sentiment label.
message Sentiment {
  // e.g. "positive", "negative", "neutral".
  string label = 1;
  double score = 2;
}

// Aggregate frequency of one term with every occurrence.
message TermVector {
  string term = 1;
  int32 frequency = 2;
  // Empty in TERM_VECTOR_MODE_SCORING_ONLY.
  repeated AnnotationSpan occurrences = 3;
  TermVectorMode mode = 4;
}

// ============================================================================
// Text quality and privacy
// ============================================================================

// Personally identifying data found in the text.
message PiiMention {
  PiiType type = 1;
  // The canonical form, e.g. digits only for a phone number.
  string normalized = 2;
}

enum PiiType {
  PII_TYPE_UNSPECIFIED = 0;
  PII_TYPE_EMAIL = 1;
  PII_TYPE_PHONE = 2;
  PII_TYPE_IBAN = 3;
  PII_TYPE_CARD = 4;
  PII_TYPE_MAC = 5;
  PII_TYPE_AWS_ACCESS_KEY = 6;
  PII_TYPE_GITHUB_TOKEN = 7;
  PII_TYPE_JWT = 8;
  PII_TYPE_BTC_ADDRESS = 9;
  PII_TYPE_ETH_ADDRESS = 10;
  PII_TYPE_ABA_ROUTING = 11;
  PII_TYPE_URL_CREDENTIAL = 12;
  PII_TYPE_US_SSN = 13;
  PII_TYPE_US_ITIN = 14;
  PII_TYPE_UK_NHS = 15;
  PII_TYPE_DE_STEUER_ID = 16;
  PII_TYPE_IMEI = 17;
  PII_TYPE_CA_SIN = 18;
}

// A span of damaged or low-quality text.
message NoiseSpan {
  NoiseSeverity severity = 1;
  double score = 2;
}

enum NoiseSeverity {
  NOISE_SEVERITY_UNSPECIFIED = 0;
  NOISE_SEVERITY_MISSPELLED = 1;
  NOISE_SEVERITY_DAMAGED = 2;
  NOISE_SEVERITY_GIBBERISH = 3;
  NOISE_SEVERITY_BINARYISH = 4;
}

// A character-level artifact (encoding damage, invisible characters).
message TextArtifact {
  TextArtifactType type = 1;
}

enum TextArtifactType {
  TEXT_ARTIFACT_TYPE_UNSPECIFIED = 0;
  TEXT_ARTIFACT_TYPE_REPLACEMENT = 1;
  TEXT_ARTIFACT_TYPE_CONTROL = 2;
  TEXT_ARTIFACT_TYPE_NONCHARACTER = 3;
  TEXT_ARTIFACT_TYPE_UNPAIRED_SURROGATE = 4;
  TEXT_ARTIFACT_TYPE_PRIVATE_USE = 5;
  TEXT_ARTIFACT_TYPE_BIDI_CONTROL = 6;
  TEXT_ARTIFACT_TYPE_ZERO_WIDTH = 7;
  TEXT_ARTIFACT_TYPE_UNICODE_TAG = 8;
  TEXT_ARTIFACT_TYPE_MOJIBAKE = 9;
}

// An encoded binary payload embedded in the text (a data URI, base64 block).
message EmbeddedAsset {
  // The encoded payload inside the annotation's span.
  AnnotationSpan payload = 1;
  AssetFormat format = 2;
  // The declared or sniffed media type, e.g. "image/png".
  string media_type = 3;
  // Size in bytes once decoded.
  int64 decoded_length = 4;
  // Pixel size for images; 0 when not an image or unknown.
  int32 width = 5;
  int32 height = 6;
}

enum AssetFormat {
  ASSET_FORMAT_UNSPECIFIED = 0;
  ASSET_FORMAT_PNG = 1;
  ASSET_FORMAT_JPEG = 2;
  ASSET_FORMAT_GIF = 3;
  ASSET_FORMAT_WEBP = 4;
  ASSET_FORMAT_WAV = 5;
  ASSET_FORMAT_PDF = 6;
  ASSET_FORMAT_ZIP = 7;
  ASSET_FORMAT_TIFF = 8;
  ASSET_FORMAT_GZIP = 9;
  ASSET_FORMAT_SEVEN_ZIP = 10;
  ASSET_FORMAT_RAR = 11;
  ASSET_FORMAT_FLAC = 12;
  ASSET_FORMAT_OGG = 13;
  ASSET_FORMAT_MIDI = 14;
}

// ============================================================================
// Vectors
// ============================================================================

// A dense vector for one annotation of the layer named by
// TypedLayer.indexes_layer, or for the span.
message Embedding {
  repeated float vector = 1;
  // Index of the source annotation; absent when the span alone identifies it.
  optional int32 source = 2;
  EmbeddingGranularity granularity = 3;
  VectorNormalization normalization = 4;
  optional EmbeddingRoute route = 5;
}

// ============================================================================
// Fallback
// ============================================================================

// A layer value with no dedicated message: an add-on layer the contract does
// not type yet. Readers should prefer the typed arms; a value moves out of
// here once it has its own message.
message GenericValue {
  // The producer's value type, e.g. the Java class name.
  string value_type = 1;
  oneof value {
    string text = 2;
    double number = 3;
    bool flag = 4;
    google.protobuf.Struct structured = 5;
  }
}
