# CI gates for grpc-xml: the same commands README.md documents, so a green
# badge and a green local run mean the same thing.
name: ci

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A checksummed release download behaves the same on GitHub and Forgejo.
      - name: Install buf
        env:
          BUF_VERSION: 1.71.0
        run: |
          base="https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}"
          bin="buf-Linux-$(uname -m)"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$bin"
          curl -sSfL "$base/sha256.txt" | grep " $bin\$" | sha256sum -c -
          install -m 0755 "$bin" /usr/local/bin/buf
          buf --version
      - name: buf lint
        run: buf lint
      - name: buf format
        run: buf format --diff --exit-code
      # Contract evolution is guarded against main once history exists there.
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth 1
          buf breaking --against '.git#ref=origin/main'

  rust:
    runs-on: ubuntu-latest
    # Docker Hardened Images Rust toolchain, the image the Dockerfile builds
    # from. dhi.io signs in with the Docker Hub org credentials.
    container:
      image: dhi.io/rust:1-dev
      credentials:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      # The hardened image ships the Rust toolchain (rustfmt and clippy
      # included) and a C linker only. The build needs protoc, the actions
      # need git and node.
      - name: Install job tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git nodejs protobuf-compiler libprotobuf-dev
          # The workspace mount belongs to the runner user, not root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (pedantic)
        run: cargo clippy --all-targets --no-deps -- -D warnings -D clippy::pedantic
      - name: tests
        run: cargo test --locked
      - name: rustdoc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hardened Images (dhi.io)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      # The image build runs the suite itself, so this also proves the tests
      # pass in a clean container with no host toolchain state.
      - name: docker build
        run: docker build -t grpc-xml:ci .
