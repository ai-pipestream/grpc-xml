[package]
name = "grpc-xml"
version = "0.1.0"
description = "Streaming gRPC collector for JATS, USPTO, XBRL and DocLang XML, plus DocLang archives and Google Books METS exports"
license = "Apache-2.0"
readme = "README.md"
repository = "https://git.rokkon.com/ai-pipestream/grpc-xml"
keywords = ["xml", "jats", "xbrl", "grpc", "streaming"]
categories = ["parsing", "network-programming"]
edition = "2024"
# Edition 2024 needs 1.85; quick-xml 0.41 needs 1.79.
rust-version = "1.85"
publish = false

[dependencies]
# Streaming pull parser. No DTD processing, no entity expansion, no network:
# general entity references surface as `Event::GeneralRef` and are never
# resolved, which is the property the XXE and billion-laughs tests assert.
quick-xml = { version = "0.41.0", features = ["encoding"] }
prost = "0.14.4"
# `google.protobuf.Value`, which the vendored document schema uses for the
# `BaseMeta.custom_fields` escape hatch the Document fold writes into.
prost-types = "0.14.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14.6", features = ["gzip", "zstd"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
# DocLang archives (.dclx) are OPC zips; only deflate is needed to read the
# ones docling-core writes, and the tests build theirs with the same crate.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Google Books METS exports are gzipped tars; the archive driver streams the
# gzip through the tar reader and counts every inflated byte against the cap.
flate2 = "1.1.9"
tar = "0.4.46"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
# "net" enables TcpListenerStream for the in-process integration test server.
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
